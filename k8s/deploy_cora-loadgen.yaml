apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cora-loadgen
    part-of: cora-demo
  name: cora-loadgen
  namespace: natwest
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cora-loadgen
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-09-01T14:10:52+01:00'
      labels:
        app: cora-loadgen
        part-of: cora-demo
    spec:
      containers:
      - command:
        - python3
        - /app/loadgen.py
        env:
        - name: BASE_INTERVAL_S
          value: '30'
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        name: loadgen
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app
          name: code
        - mountPath: /var/run/chaos
          name: chaos-token
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: cora-loadgen-code
        name: code
      - name: chaos-token
        secret:
          defaultMode: 420
          items:
          - key: CHAOS_PRESENTER_TOKEN
            path: CHAOS_PRESENTER_TOKEN
          secretName: chaos-controller-token
