apiVersion: v1
kind: Service
metadata:
  labels:
    app: cora-otelcol
    part-of: cora-demo
  name: cora-otelcol
  namespace: natwest
spec:
  ports:
  - name: otlp-grpc
    port: 4317
    protocol: TCP
    targetPort: 4317
  - name: otlp-http
    port: 4318
    protocol: TCP
    targetPort: 4318
  selector:
    app: cora-otelcol
  type: ClusterIP
