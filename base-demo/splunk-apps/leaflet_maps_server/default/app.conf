#
# leaflet_maps_server
#
# Minimal companion app that hosts the world_countries.svg referenced by
# Splunk Dashboard Studio's `splunk.choropleth.svg` visualizations on the
# native ITSI Glass Tables (see scripts/lib/glass_table_convert.py).
#
# Why this app exists
# -------------------
# The choropleth SVG visualization expects an `svgUrl` it can fetch over
# HTTP. The conventional path used across Splunkbase-derived choropleth
# tutorials is `/static/app/leaflet_maps_server/world_countries.svg`,
# which maps to `<this app>/appserver/static/world_countries.svg`. Without
# this app installed, the SVG 404s and the choropleth tile renders empty
# (rest of the Glass Table is unaffected).
#
# The SVG itself is the upstream `flekschas/simple-world-map` (MIT
# licensed; see LICENSE in this directory): 181 countries annotated with
# lowercase ISO 3166-1 alpha-2 ids on each <path>, which is exactly what
# the SPL `geom geo_countries` command emits as a feature key. No
# Splunkbase dependency, no third-party install.

[install]
is_configured = true
state = enabled

[package]
id = leaflet_maps_server
check_for_updates = false

[ui]
is_visible = false
label = Leaflet Maps Server (Glass Table SVG assets)

[launcher]
author = NatWest Card Payments demo
description = Hosts world_countries.svg for the splunk.choropleth.svg visualizations used by the native ITSI Glass Tables. Internal app, not user-facing.
version = 1.0.0
