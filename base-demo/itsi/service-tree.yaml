# NatWest Card Payments - ITSI service tree manifest.
#
# Source of truth for: services, dependencies, KPIs, KPI base searches,
# entity types, and entities. Consumed by scripts/07-itsi-bootstrap.sh which
# renders this into
# ITSI's REST API (idempotent upsert via deterministic _key fields).
#
# Tree shape (mirrors the platform call graph - Channels -> API Gateway
# entry, which fans out to Payment Services, Experience Services,
# Business Services and Ledger & Settlement Services):
#   L1 NatWest Card Payments
#     L3 API Gateway
#       L2 Payment Services           (init/validate/route/fee/status)
#       L2 Experience Services        (user/profile/limits/notification)
#       L2 Business Services          (account/beneficiary/sanctions/fraud)
#       L2 Ledger & Settlement        (ledger/settle/recon/report + PG/Kafka)
#       L2 Payment Networks         (FPS/BACS/CHAPS/SWIFT/SEPA/Cheque)
#         ^ linked from Payment, Experience, Business and Ledger & Settlement
#     L2 Digital Customer Experience  (ThousandEyes synthetics)
#     L2 Customer Tier Experience (merged Bronze/Silver/Gold; was 3 tiles)
#     L3 individual microservices
#     L4 Postgres / Redis / Kafka

# DEMO TUNING: when demo_steady_state_green is true, scripts/lib/itsi_bootstrap.py
# clears inline KPI thresholds so L1/L2/L4 tiles stay normal under steady-state
# traffic. Services may opt selective KPIs back in via demo_threshold_kpi_titles
# (e.g. tier-throttle, gold-fast-path-off, madrid-network-degradation). Re-run
# scripts/07-itsi-bootstrap.sh after edits.
demo_steady_state_green: true

metadata:
  security_group: default_itsi_security_group
  default_severity_aggregation: weighted_avg
  # Index conventions assumed by the KPI base searches below:
  #   index=otel_traces sourcetype="otel:traces" -> spans (collector splunk_hec exporter for traces).
  #                                                Spans are isolated from `main` so Splunk
  #                                                Observability Log Observer Connect doesn't
  #                                                surface every span as an "unknown log type".
  #   index=main sourcetype="otel:logs"    -> service stdout JSON logs (already wired).
  #   index=splunkrum                       -> RUM events (Log Observer Connect from o11y).
  #   index=_internal sourcetype=splunkd    -> Splunk Enterprise self-monitoring.
  # The bootstrap script logs a warning if any of the above returns 0 events at
  # the time of the run; KPIs still get created and will populate once data
  # flows.
  spans_index_search: 'index=otel_traces sourcetype="otel:traces"'
  logs_index_search:  'index=main sourcetype="otel:logs"'
  rum_index_search:   'index=splunkrum'
  # Splunk Observability Cloud realm for entity-type navigation drilldowns
  # (Synthetic Business Outcomes → Synthetics test summary). Overridden at
  # bootstrap time by TF_VAR_splunk_realm when set.
  splunk_o11y_realm: eu0

# ---------------------------------------------------------------------------
# Entity types (ITSI classification + drilldown placeholders).
# ---------------------------------------------------------------------------
entity_types:
  - _key: nwpay_et_thousandeyes
    title: ThousandEyes
    # Required for navigation_link dashboard_drilldowns to appear in Service
    # Analyzer → KPI → Entities → Drilldowns (see itsi_entity.py:
    # show_navigation_in_service_analyzer).
    show_navigation_in_service_analyzer: true
    description: >
      Drilldown class for the six ThousandEyes synthetic tests under Digital
      Customer Experience. data_drilldowns let an operator who is looking at
      one TE entity in Service Analyzer click straight through to the matching
      `index=thousandeyes` events for that test (filtered by
      `thousandeyes.test.name`, matched via the entity identifier
      `te_test_name`). dashboard_drilldowns deep-link to the live ThousandEyes
      web app for the matching test, using the per-entity te_test_id field for
      `${te_test_id}` token substitution in the URL.
    data_drilldowns:
      - title: ThousandEyes path-vis events
        type: events
        static_filter:
          type: include
          field: sourcetype
          values:
            - "cisco:thousandeyes:path-vis"
        entity_field_filter:
          type: entity
          data_field: thousandeyes.test.name
          entity_field: te_test_name
      - title: ThousandEyes web-transaction traces
        type: events
        static_filter:
          type: include
          field: sourcetype
          values:
            - "cisco:thousandeyes:trace"
        entity_field_filter:
          type: entity
          data_field: thousandeyes.test.name
          entity_field: te_test_name
    dashboard_drilldowns:
      # Deep-link to the specific test in the ThousandEyes web app
      # (https://app.thousandeyes.com/test_settings/?testId=<id>). The
      # ${te_test_id} token is substituted at click time from the entity's
      # informational.te_test_id field.
      - id: te_test_settings
        title: ThousandEyes — test settings
        dashboard_type: navigation_link
        base_url: "https://app.thousandeyes.com/test_settings/?testId=${te_test_id}"
        params:
          static_params: {}
          alias_param_map: []
      # Deep-link to the live test view (path-vis / web-transactions) in
      # the ThousandEyes web app for the matching test.
      - id: te_views
        title: ThousandEyes — live views
        dashboard_type: navigation_link
        base_url: "https://app.thousandeyes.com/#/views/tests/${te_test_id}"
        params:
          static_params: {}
          alias_param_map: []
    # vital_metrics drives the per-tile chart on the ITSI Entity Insights page
    # (/app/itsi/entity_overview?groupBy=type). Each entity is keyed by the
    # ThousandEyes test name (`te_test_name` identifier) so vital-metric
    # joins align with the DCE KPI entity-breakdown field.
    vital_metrics:
      - metric_name: Availability
        unit: "%"
        is_key: 1
        matching_entity_fields:
          - te_test_name
        split_by_fields:
          - te_test_name
        search: |-
          search index=thousandeyes sourcetype="cisco:thousandeyes:path-vis"
          | rename "metric_name:http.server.request.availability" AS http_avail
          | rename "metric_name:web.page_load.completion"          AS page_completion
          | rename "metric_name:dns.lookup.availability"           AS dns_avail
          | rename "metric_name:web.transaction.completion"        AS tx_completion
          | rename "thousandeyes.test.name"                        AS te_test_name
          | eval val = coalesce(http_avail, page_completion, dns_avail, tx_completion*100)
          | where isnotnull(val) AND isnotnull(te_test_name)
          | bin _time span=5m
          | stats avg(val) AS val by _time, te_test_name
      - metric_name: Response time
        unit: ms
        is_key: 0
        matching_entity_fields:
          - te_test_name
        split_by_fields:
          - te_test_name
        search: |-
          search index=thousandeyes sourcetype="cisco:thousandeyes:path-vis"
          | rename "metric_name:http.client.request.duration" AS http_dur_s
          | rename "metric_name:web.page_load.duration"       AS page_load_s
          | rename "thousandeyes.test.name"                   AS te_test_name
          | eval val = coalesce(http_dur_s * 1000, page_load_s * 1000)
          | where isnotnull(val) AND isnotnull(te_test_name)
          | bin _time span=5m
          | stats avg(val) AS val by _time, te_test_name

  - _key: nwpay_et_splunk_synthetics
    title: Splunk Observability Synthetics
    show_navigation_in_service_analyzer: true
    description: >
      Drilldown class for Synthetic Business Outcomes KPI entities. KPI signal
      still comes from ThousandEyes events in Splunk Enterprise; navigation
      drilldowns deep-link to the matching Splunk Observability Synthetics
      test in O11y Cloud using the per-entity syn_test_id field.
    dashboard_drilldowns:
      - id: syn_test_summary
        title: Splunk Synthetics — test summary
        dashboard_type: navigation_link
        base_url: "https://app.__SPLUNK_REALM__.signalfx.com/#/synthetics/tests/${syn_test_id}"
        params:
          static_params: {}
          alias_param_map: []
      - id: syn_test_overview
        title: Splunk Synthetics — all tests
        dashboard_type: navigation_link
        base_url: "https://app.__SPLUNK_REALM__.signalfx.com/#/synthetics"
        params:
          static_params: {}
          alias_param_map: []

  - _key: nwpay_et_postgres_database
    title: Postgres database
    description: >
      Drilldown class for in-cluster Postgres databases scraped by
      postgres_exporter. data_drilldowns scope ITSI metrics index rows to
      the entity identifier `pg_database` (maps to the `datname` dimension
      on pg_stat_database_* metrics).
    data_drilldowns:
      - title: Postgres database metrics
        type: metrics
        static_filter:
          type: include
          field: metric_name
          values:
            - "pg_stat_database_*"
            - "pg_database_size_bytes"
            - "pg_long_running_transactions"
        entity_field_filter:
          type: entity
          data_field: datname
          entity_field: pg_database

  - _key: nwpay_et_kafka_broker
    title: Kafka broker
    description: >
      Drilldown class for in-cluster Kafka brokers scraped via the JMX
      exporter sidecar. Entity identifier `kafka_instance` maps to the
      `service.instance.id` dimension on kafka_* metrics in
      index=itsi_im_metrics.
    data_drilldowns:
      - title: Kafka broker metrics
        type: metrics
        static_filter:
          type: include
          field: metric_name
          values:
            - "kafka.*"
            - "kafka_server_*"
            - "kafka_network_*"
            - "kafka_controller_*"
        entity_field_filter:
          type: entity
          data_field: service.instance.id
          entity_field: kafka_instance

# ---------------------------------------------------------------------------
# KPI base searches.
#
# Each KPI base search is a parameterised SPL that produces one or more
# numeric metrics. Service KPIs reference a base search by `id` and pick a
# metric from it by `metric_id`, optionally adding entity-scoped filters.
# ---------------------------------------------------------------------------
kpi_base_searches:

  - id: kbs_apm_latency
    title: APM span p99 latency by service
    description: |
      p99 span duration per minute, grouped by OTel service.name. Drives every
      "p99 latency" KPI in the tree. Source: spans forwarded to HEC by the
      OTel collector's splunk_hec traces exporter.

      The exporter currently lands events with sourcetype=httpevent (HEC
      default) rather than the documented sourcetype=otel:traces, so we
      accept both. Span duration is computed as end_time - start_time
      (nanoseconds) when the legacy `duration_ns` field isn't present.
      Span attributes are nested under `attributes.*` in the httpevent
      payload; we lift `customer.tier` out for tier-aware filters.
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=*
      | rename "service.name" as service_name
      | rename "attributes.customer.tier" as customer_tier
      | eval duration_ns = coalesce(duration_ns, end_time - start_time)
      | bin _time span=1m
      | stats perc99(duration_ns) as p99_ns by _time, service_name, customer_tier
      | eval p99_ms = round(p99_ns / 1000000, 0)
    entity_alias_filtering_fields: service_name
    metrics:
      - id: p99_ms
        title: p99 latency
        unit: ms
        threshold_field: p99_ms
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown

  - id: kbs_apm_error_rate
    title: APM span error rate by service
    description: |
      Per-minute error ratio (errors / total spans), grouped by service.name
      and customer.tier so tier KPIs can specialise the same base search.
      An "error" is any span whose OTel status.code is STATUS_CODE_ERROR
      (set by the SDK on uncaught exceptions / 5xx responses) or whose
      legacy `error` boolean was set on the resource attributes.
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=*
      | rename "service.name" as service_name
      | rename "attributes.customer.tier" as customer_tier
      | rename "status.code" as status_code
      | bin _time span=1m
      | stats count(eval(status_code="STATUS_CODE_ERROR" OR 'error'="true")) as errors,
              count                                                          as total
              by _time, service_name, customer_tier
      | eval error_rate = round(errors / total, 4)
    entity_alias_filtering_fields: service_name
    metrics:
      - id: error_rate
        title: error rate
        unit: ratio
        threshold_field: error_rate
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown

  - id: kbs_apm_request_rate
    title: APM span request rate by service
    description: |
      Per-minute SERVER-span count, divided by 60 to give RPS. Server
      spans = inbound HTTP/grpc handlers, so this counts external calls
      hitting each service. Filters on both the legacy `span_kind`
      (otel:traces format) and the current `kind` field (httpevent
      format) emitted by the splunk_hec exporter.
    base_search: |
      index=otel_traces sourcetype="otel:traces"
        service.name=* (kind="SPAN_KIND_SERVER" OR span_kind="SPAN_KIND_SERVER")
      | rename "service.name" as service_name
      | rename "attributes.customer.tier" as customer_tier
      | bin _time span=1m
      | stats count as rpm by _time, service_name, customer_tier
      | eval rps = round(rpm / 60.0, 2)
    entity_alias_filtering_fields: service_name
    metrics:
      - id: rps
        title: requests per second
        unit: rps
        threshold_field: rps
        aggregate_statop: sum
        entity_statop:    sum
        gap_severity:     unknown

  - id: kbs_apm_throttle_rate
    title: Throttle rate at api-gateway by tier
    description: |
      Fraction of api-gateway spans where payment.throttled=true. Drives
      the "throttle rate" KPI on the API Gateway tier and the per-tier
      decline KPIs. Reads from both `payment.throttled` (otel:traces
      format) and `attributes.payment.throttled` (httpevent format).
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=api-gateway
      | rename "attributes.customer.tier" as customer_tier
      | rename "attributes.payment.throttled" as attr_throttled
      | bin _time span=1m
      | stats count(eval(attr_throttled="true" OR 'payment.throttled'="true")) as throttled,
              count                                                              as total
              by _time, customer_tier
      | eval throttle_rate = round(throttled / total, 4)
    entity_alias_filtering_fields: customer_tier
    metrics:
      - id: throttle_rate
        title: throttle rate
        unit: ratio
        threshold_field: throttle_rate
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown

  - id: kbs_payments_by_location
    title: Payments by customer location (p95 latency, RPS, error rate)
    description: |
      Per-minute APM aggregates split by customer.location (the city the
      payment originated from). Drives the L2 "Payments by Location"
      service so a regional latency story (e.g. Madrid client-side RTT
      degradation) shows up as one bad city rather than a global p95
      lift.

      Source is the api-gateway server span - that's where the SDK has
      finished extracting the customer.location attribute from the
      JSON body, so every row has a populated city. Spans without a
      location (e.g. internal health checks) are dropped by the
      `customer_location!=""` filter so they don't poison the bucket
      with empty-string rows.

      The same KBS also surfaces the roaming-payment p95 (filter
      `payment.roaming=true`) so the fraud-detection story has a
      single, stable KPI it can pivot on.
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=api-gateway
        (kind="SPAN_KIND_SERVER" OR span_kind="SPAN_KIND_SERVER")
      | rename "attributes.customer.location" as customer_location
      | rename "attributes.customer.country"  as customer_country
      | rename "attributes.customer.region"   as customer_region
      | rename "attributes.payment.roaming"   as payment_roaming
      | rename "status.code"                  as status_code
      | where isnotnull(customer_location) AND customer_location!=""
      | eval duration_ns = coalesce(duration_ns, end_time - start_time)
      | bin _time span=1m
      | stats perc95(duration_ns) as p95_ns,
              perc99(duration_ns) as p99_ns,
              count               as rpm,
              count(eval(status_code="STATUS_CODE_ERROR" OR 'error'="true")) as errors
              by _time, customer_location, customer_country, customer_region, payment_roaming
      | eval p95_ms     = round(p95_ns / 1000000, 0),
             p99_ms     = round(p99_ns / 1000000, 0),
             rps        = round(rpm / 60.0, 2),
             error_rate = round(errors / rpm, 4)
    entity_alias_filtering_fields: customer_location
    metrics:
      - id: p95_ms
        title: p95 latency by location
        unit: ms
        threshold_field: p95_ms
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: p99_ms
        title: p99 latency by location
        unit: ms
        threshold_field: p99_ms
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: rps
        title: requests per second by location
        unit: rps
        threshold_field: rps
        aggregate_statop: sum
        entity_statop:    sum
        gap_severity:     unknown
      - id: error_rate
        title: error rate by location
        unit: ratio
        threshold_field: error_rate
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown

  - id: kbs_madrid_p95_chaos_gated
    title: Madrid p95 latency (chaos-gated)
    description: |
      Madrid-only p95 at the api-gateway. Reports the real latency only
      while `madrid-network-degradation` chaos is injected; otherwise
      emits 0 so the ITSI KPI stays green at steady state even when the
      global span p95 is elevated.
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=api-gateway
        (kind="SPAN_KIND_SERVER" OR span_kind="SPAN_KIND_SERVER")
      | rename "attributes.customer.location" as customer_location
      | where customer_location="madrid"
      | eval duration_ns = coalesce(duration_ns, end_time - start_time)
      | bin _time span=1m
      | stats perc95(duration_ns) as p95_ns by _time
      | eval actual_p95_ms = round(p95_ns / 1000000, 0)
      | appendcols [
          search index=nwpay_audit sourcetype="nwpay:chaos" scenario="madrid-network-degradation" earliest=-7d
          | sort - _time
          | head 1
          | eval chaos_active=if(action="inject", 1, 0)
          | fields chaos_active
        ]
      | eval chaos_active=coalesce(chaos_active, 0)
      | eval p95_ms = if(chaos_active=1, actual_p95_ms, 0)
      | fields _time, p95_ms
    metrics:
      - id: p95_ms
        title: Madrid p95 latency
        unit: ms
        threshold_field: p95_ms
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown

  - id: kbs_tier_bronze_decline_chaos_gated
    title: Bronze decline rate (chaos-gated)
    description: |
      Bronze-tier gateway error rate, surfaced only while a tier-throttle or
      bad-deploy chaos scenario is actively injected. Steady state reports 0
      so Customer Tier Experience stays green when no chaos is running.
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=api-gateway
      | rename "attributes.customer.tier" as customer_tier
      | where customer_tier="bronze"
      | rename "status.code" as status_code
      | bin _time span=1m
      | stats count(eval(status_code="STATUS_CODE_ERROR" OR 'error'="true")) as errors,
              count as total by _time
      | eval actual_error_rate = if(total > 0, round(errors / total, 4), 0)
      | appendcols [
          search index=nwpay_audit sourcetype="nwpay:chaos"
            (scenario="tier-throttle" OR scenario="bad-deploy-payment-initiation" OR scenario="bad-deploy-fraud")
            earliest=-7d
          | sort - _time | head 1
          | eval chaos_active=if(action="inject", 1, 0)
          | fields chaos_active
        ]
      | eval chaos_active=coalesce(chaos_active, 0)
      | eval error_rate = if(chaos_active=1, actual_error_rate, 0)
      | fields _time, error_rate
    metrics:
      - id: error_rate
        title: bronze decline rate
        unit: ratio
        threshold_field: error_rate
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown

  - id: kbs_tier_gold_p95_chaos_gated
    title: Gold p95 latency (chaos-gated)
    description: |
      Gold-tier payment-initiation p99 latency, surfaced only while
      gold-fast-path-off or a bad-deploy chaos scenario is actively injected.
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=payment-initiation-service
      | rename "attributes.customer.tier" as customer_tier
      | where customer_tier="gold"
      | eval duration_ns = coalesce(duration_ns, end_time - start_time)
      | bin _time span=1m
      | stats perc99(duration_ns) as p99_ns by _time
      | eval actual_p99_ms = round(p99_ns / 1000000, 0)
      | appendcols [
          search index=nwpay_audit sourcetype="nwpay:chaos"
            (scenario="gold-fast-path-off" OR scenario="bad-deploy-payment-initiation" OR scenario="bad-deploy-fraud")
            earliest=-7d
          | sort - _time | head 1
          | eval chaos_active=if(action="inject", 1, 0)
          | fields chaos_active
        ]
      | eval chaos_active=coalesce(chaos_active, 0)
      | eval p99_ms = if(chaos_active=1, actual_p99_ms, 0)
      | fields _time, p99_ms
    metrics:
      - id: p99_ms
        title: gold p99 latency
        unit: ms
        threshold_field: p99_ms
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown

  - id: kbs_cache_miss_rate
    title: Sanctions cache miss rate
    description: |
      Mirrors the existing Splunk Observability detector at
      terraform/observability.tf:99-120. Warns at 10% miss rate.
      Reads cache attributes from both the otel:traces top-level
      (cache.namespace / cache.hit) and the httpevent nested form
      (attributes.cache.namespace / attributes.cache.hit).
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=sanctions-aml-service
      | rename "attributes.cache.namespace" as attr_cache_ns
      | rename "attributes.cache.hit" as attr_cache_hit
      | where attr_cache_ns="sanctions" OR 'cache.namespace'="sanctions"
      | bin _time span=1m
      | stats count(eval(attr_cache_hit="false" OR 'cache.hit'="false")) as misses,
              count                                                       as total
              by _time
      | eval miss_rate = round(misses / total, 4)
    metrics:
      - id: miss_rate
        title: cache miss rate
        unit: ratio
        threshold_field: miss_rate
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown

  - id: kbs_rum_page_load
    title: RUM page load p95 (server-side proxy)
    description: |
      Historical context (2026-06-11): the original implementation queried
      `index=splunkrum event="page_view"` and assumed Log Observer Connect
      was federating Splunk RUM page-view events from Splunk Observability
      Cloud into a local `splunkrum` index on Splunk Enterprise. LOC was
      never wired up in this demo, so the index doesn't exist and the KPI
      sat at zero for every operator. The Customer Channel tile read "no
      data" even during a live demo where the SPA was actually under load.

      Current implementation: api-gateway server-side p95 latency for the
      first XHR each SPA session makes (POST /process, which the user
      triggers on Send Payment). This is a server-side proxy for the
      user-perceived "the page is slow" signal:

        * When db-slow chaos hits, the gateway's call into ledger-service
          blocks, gateway p95 climbs, and the SPA's submit button visibly
          spins. The KPI moves.
        * When fraud-burst or latency-storm chaos hits, the gateway path
          stretches, p95 climbs, the SPA's "waiting" overlay extends. The
          KPI moves.
        * When kafka-outage hits, settlement returns 5xx and the gateway
          response time briefly spikes before failure mode kicks in. The
          KPI moves.

      Caveats (presenter notes):
        * Does NOT capture the SPA's static-asset load (index.html, JS
          bundle, CSS) - that's served by nginx + the web-frontend pod,
          neither of which exports OTel spans for static GETs. The true
          first-contentful-paint signal only lives in Splunk Observability
          RUM (web vitals: rum.lcp.app.natwest-payments-web). To upgrade
          this KPI to the real RUM metric, configure the Splunk App for
          Splunk Observability Cloud (already installed at
          /opt/splunk/etc/apps/splunk_app_for_splunk_o11y_cloud) with a
          user-level API token (TF_VAR_splunk_api_token), then change the
          base search to:
            | rest /servicesNS/-/splunk_app_for_splunk_o11y_cloud/o11y-metrictimeseries
                  program="data('rum.lcp.app.natwest-payments-web').percentile(95).publish()"
                  start_time="-2m" end_time="now"
            | spath value | rename value AS p95_ms
        * The XHR p95 is a per-request signal, not a per-page-load signal.
          One slow XHR per page = one sample; the "page load p95" name is
          retained for ITSI/glass-table compatibility but the metric is
          better thought of as "first-XHR p95".

      Splits the value by customer_tier so the Bronze / Silver / Gold
      service tiles light up independently (matches the per-tier story
      the synthetic-outcomes panel tells).
    base_search: |
      index=otel_traces service.name=api-gateway name="POST /process"
      | rename "attributes.customer.tier" as customer_tier
      | eval duration_ms = (end_time - start_time) / 1000000
      | eval customer_tier = coalesce(customer_tier, "unknown")
      | bin _time span=1m
      | stats perc95(duration_ms) as p95_ms by _time, customer_tier
    entity_alias_filtering_fields: customer_tier
    metrics:
      - id: p95_ms
        title: page load p95
        unit: ms
        threshold_field: p95_ms
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown

  - id: kbs_synthetic_success
    title: Synthetic check success rate
    description: |
      Historical context (2026-06-11): the original implementation queried
      `index=splunkrum event="synthetic_run"` and assumed Splunk Synthetics
      checks landed in a local `splunkrum` index via Log Observer Connect.
      LOC was never wired up so the KPI read zero. The Customer Channel
      tile showed "no data" even when our six ThousandEyes tests were
      successfully probing the public SPA + API gateway URLs.

      Current implementation: rolls up the http.server.request.availability
      signal from ThousandEyes tests TE-01 (login page availability) and
      TE-02 (API gateway availability), both of which already feed
      index=thousandeyes via the Cisco ThousandEyes Add-on for Splunk's
      Streaming integration (see scripts/09-configure-splunk-te-inputs.sh).

      Why TE instead of Splunk Synthetics:
        * TE is already provisioned and configured for this demo
          (scripts/08-configure-thousandeyes.sh creates the six tests).
        * TE-01 + TE-02 directly probe the public demo URLs from five
          geographies, which is closer to a real customer's "is the bank
          up?" perspective than an internal Splunk Synthetic check would
          be.
        * Splunk Synthetics costs device-minutes; reusing TE costs
          nothing extra for this demo.

      Failure semantics: success_rate = avg(http.server.request.availability) / 100,
      where each TE probe returns 100 when its HTTP response matched the
      configured status code AND content regex, else 0. We average across
      both tests + all agents per minute so a single-agent flake doesn't
      open a notable.

      Caveat: TE-01 + TE-02 run every minute by default, which gives the
      KPI ~5 samples per 5-minute window. If TE's streaming integration
      stalls (we saw this for 40 days when the `enabled` flag on the
      stream flipped to false in 2026-05), success_rate goes to N/A
      rather than 0 because the bin produces no rows. The TE freshness
      preflight check in scripts/00-preflight.sh catches that decay.
    base_search: |
      index=thousandeyes sourcetype="cisco:thousandeyes:path-vis"
      | rename "metric_name:http.server.request.availability" AS http_avail
      | rename "thousandeyes.test.name" AS test_name
      | where (test_name="NatWest Payments - SPA login page"
             OR test_name="NatWest Payments - API gateway recent"
             OR test_name="NatWest Payments - POST /api/process"
             OR test_name="NatWest Payments - SPA login page-load")
            AND isnotnull(http_avail)
      | bin _time span=5m
      | stats avg(http_avail) AS avg_avail by _time
      | eval success_rate = round(avg_avail / 100, 3)
    metrics:
      - id: success_rate
        title: synthetic success rate
        unit: ratio
        threshold_field: success_rate
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown

  - id: kbs_kafka_lag
    title: Kafka consumer lag for payments.settled
    description: |
      Pulls Kafka consumer-group lag from settlement-service spans (the
      OTel collector emits messaging.kafka.consumer.lag on consumer
      `process` spans when kafkaConsumerEnabled=true). Reads both the
      legacy top-level fields (messaging.system / messaging.operation /
      messaging.kafka.consumer.lag) and their httpevent-flattened
      attributes.* equivalents.
    base_search: |
      index=otel_traces sourcetype="otel:traces" service.name=settlement-service
      | rename "attributes.messaging.system" as attr_msg_system
      | rename "attributes.messaging.operation" as attr_msg_op
      | rename "attributes.messaging.kafka.consumer.lag" as attr_msg_lag
      | where (attr_msg_system="kafka" OR 'messaging.system'="kafka")
            AND (attr_msg_op="process" OR 'messaging.operation'="process")
      | eval lag_value = coalesce(attr_msg_lag, 'messaging.kafka.consumer.lag')
      | bin _time span=1m
      | stats max(lag_value) as lag by _time
    metrics:
      - id: lag
        title: consumer lag
        unit: messages
        threshold_field: lag
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown

  # -----------------------------------------------------------------------
  # Redis health KPIs (sourced from collector/values.yaml redis receiver +
  # prometheus/infra job for redis_exporter). Three numeric metrics:
  #   * evictions_per_min - sustained churn signal
  #   * memory_used_bytes - absolute memory footprint
  #   * connected_clients - reachability and pool health
  # -----------------------------------------------------------------------
  - id: kbs_redis_health
    title: Redis health (evictions, memory, clients)
    description: |
      Three Redis health signals stitched together from the OTel native
      redis receiver and the redis_exporter prometheus scrape. Drives the
      L4 nwpay_l4_redis service KPIs and feeds into the L3 microservices
      that depend on it (sanctions-aml-service, fraud-detection-service).

      itsi_im_metrics is a metric-type index, so the read path uses
      `| mstats` (event-style `index=…` against a metric store returns
      zero rows). The query pivots a single mstats aggregation over the
      union of metric names by metric_name, so either the SignalFx-schema
      native receiver names (redis.*) or the prometheus exporter names
      (redis_*) populate the same output columns.
    base_search: |
      | mstats max(_value) AS v
          WHERE index=itsi_im_metrics
                metric_name IN (
                  "redis.keys.evicted",
                  "redis.memory.used",
                  "redis.clients.connected",
                  "redis_evicted_keys_total",
                  "redis_memory_used_bytes",
                  "redis_connected_clients"
                )
          BY metric_name span=1m
      | eval evicted_total     = case(metric_name IN ("redis.keys.evicted","redis_evicted_keys_total"), v),
             memory_used_bytes = case(metric_name IN ("redis.memory.used","redis_memory_used_bytes"), v),
             connected_clients = case(metric_name IN ("redis.clients.connected","redis_connected_clients"), v)
      | stats max(evicted_total)     AS evicted_total,
              max(memory_used_bytes) AS memory_used_bytes,
              max(connected_clients) AS connected_clients
              BY _time
      | streamstats current=t window=2 range(evicted_total) AS evictions_per_min
      | eval evictions_per_min = coalesce(evictions_per_min, 0)
    metrics:
      - id: evictions_per_min
        title: evictions / min
        unit: count
        threshold_field: evictions_per_min
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: memory_used_bytes
        title: memory used
        unit: bytes
        threshold_field: memory_used_bytes
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: connected_clients
        title: connected clients
        unit: count
        threshold_field: connected_clients
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown

  # -----------------------------------------------------------------------
  # Postgres health KPIs (native postgresql receiver + postgres_exporter).
  # Eight numeric metrics covering saturation, cache, errors, throughput,
  # capacity, and stuck-connection signals:
  #   * backends            - active connections (saturation signal)
  #   * cache_hit_ratio     - shared_buffers effectiveness
  #   * deadlocks_per_min   - DML pathology indicator
  #   * rollbacks_per_min   - app-side error rate (txn aborts)
  #   * temp_bytes_per_min  - spills to disk (bad query plans / db-slow chaos)
  #   * commits_per_sec     - successful txn throughput (informational)
  #   * db_size_bytes       - capacity tracking (informational)
  #   * long_running_txns   - stuck-transaction / leak detection
  #
  # long_running_txns is sourced from pg_long_running_transactions, a
  # gauge populated by the `long_running_transactions` collector
  # (enabled via --collector.long_running_transactions on the
  # postgres_exporter sidecar in
  # helm/natwest-payments/templates/postgres.yaml). The exporter only
  # counts transactions older than 60s, which is the right cutoff for
  # a payments app where every /process call should complete in <1s;
  # anything still alive at the 60s mark is genuinely stuck (zombie
  # connection, deadlock victim, manual psql session left open). The
  # native postgresqlreceiver has no equivalent metric.
  # -----------------------------------------------------------------------
  - id: kbs_postgres_health
    title: Postgres health (backends, cache, deadlocks, rollbacks, temp, commits, db_size, idle-in-tx)
    description: |
      Eight Postgres health signals. Drives the L4 nwpay_l4_postgres KPIs
      that ledger-service depends on. Cache hit ratio is computed from
      pg_stat_database blocks_hit / blocks_read counters. commit/rollback
      and temp_bytes counters are converted into per-period rates via
      `streamstats range()` because the source is a monotonic counter.

      itsi_im_metrics is a metric-type index; the read path uses
      `| mstats`. Cumulative counters (commits, rollbacks, deadlocks,
      temp_bytes) use `latest(_value)` per 1m bucket — `sum(_value)`
      double-counts scrapes and breaks `streamstats range()`. Gauges
      (backends, db_size, blocks_*) use the same latest aggregation.

      pg_long_running_transactions has no `datname` dimension, so it is
      fetched in a subsearch (without BY datname) and joined onto the
      per-database rows as ledger-only signal.

      Entity breakdown splits on the postgres_exporter `datname` dimension
      (ledger + postgres). Instance-level gauges such as
      pg_long_running_transactions are attributed to the application
      database (ledger).
    base_search: |
      | mstats latest(_value) AS v
          WHERE index=itsi_im_metrics
                metric_name IN (
                  "pg_stat_database_numbackends",
                  "pg_stat_database_deadlocks",
                  "pg_stat_database_blks_hit",
                  "pg_stat_database_blks_read",
                  "pg_stat_database_xact_commit",
                  "pg_stat_database_xact_rollback",
                  "pg_stat_database_temp_bytes",
                  "pg_database_size_bytes"
                )
          BY metric_name datname span=1m
      | eval pg_database = if(isnotnull(datname) AND datname!="", datname, null())
      | where isnotnull(pg_database) AND pg_database IN ("ledger","postgres")
      | eval backends           = case(metric_name="pg_stat_database_numbackends",  v),
             deadlocks_total    = case(metric_name="pg_stat_database_deadlocks",   v),
             blocks_hit         = case(metric_name="pg_stat_database_blks_hit",     v),
             blocks_read        = case(metric_name="pg_stat_database_blks_read",    v),
             commits_total      = case(metric_name="pg_stat_database_xact_commit",   v),
             rollbacks_total    = case(metric_name="pg_stat_database_xact_rollback", v),
             temp_bytes_total   = case(metric_name="pg_stat_database_temp_bytes",   v),
             db_size_bytes      = case(metric_name="pg_database_size_bytes",         v)
      | stats max(backends)          AS backends,
              max(deadlocks_total)   AS deadlocks_total,
              max(blocks_hit)        AS blocks_hit,
              max(blocks_read)       AS blocks_read,
              max(commits_total)     AS commits_total,
              max(rollbacks_total)   AS rollbacks_total,
              max(temp_bytes_total)  AS temp_bytes_total,
              max(db_size_bytes)     AS db_size_bytes
              BY _time, pg_database
      | join type=left _time pg_database [
          | mstats latest(_value) AS long_running_txns
              WHERE index=itsi_im_metrics
                    metric_name="pg_long_running_transactions"
              span=1m
          | eval pg_database="ledger"
        ]
      | streamstats current=t window=2
              range(deadlocks_total)  AS deadlocks_per_min,
              range(commits_total)    AS commits_total_per_min,
              range(rollbacks_total)  AS rollbacks_per_min,
              range(temp_bytes_total) AS temp_bytes_per_min
              by pg_database
      | eval deadlocks_per_min  = coalesce(deadlocks_per_min, 0),
             rollbacks_per_min  = coalesce(rollbacks_per_min, 0),
             temp_bytes_per_min = coalesce(temp_bytes_per_min, 0),
             commits_per_sec    = round(coalesce(commits_total_per_min, 0) / 60, 3),
             long_running_txns  = coalesce(long_running_txns, 0),
             cache_hit_ratio    = round(blocks_hit / (blocks_hit + blocks_read + 1), 4)
    entity_alias_filtering_fields: pg_database
    entity_breakdown: true
    metrics:
      - id: backends
        title: active backends
        unit: count
        threshold_field: backends
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: cache_hit_ratio
        title: cache hit ratio
        unit: ratio
        threshold_field: cache_hit_ratio
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown
      - id: deadlocks_per_min
        title: deadlocks / min
        unit: count
        threshold_field: deadlocks_per_min
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: rollbacks_per_min
        title: txn rollbacks / min
        unit: count
        threshold_field: rollbacks_per_min
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: temp_bytes_per_min
        title: temp file bytes / min
        unit: bytes
        threshold_field: temp_bytes_per_min
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: commits_per_sec
        title: txn commits / sec
        unit: rate
        threshold_field: commits_per_sec
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown
      - id: db_size_bytes
        title: database size
        unit: bytes
        threshold_field: db_size_bytes
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: long_running_txns
        title: long-running txns (>60s)
        unit: count
        threshold_field: long_running_txns
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown

  # -----------------------------------------------------------------------
  # Ledger JDBC pool (chaos-gated). Surfaces HikariCP saturation only while
  # db-slow or payment-meltdown act-1 is injected; steady state reports 0 so
  # nwpay_l4_postgres stays green. Pool max is 16 (application.yml).
  # -----------------------------------------------------------------------
  - id: kbs_ledger_jdbc_pool_chaos_gated
    title: Ledger JDBC pool (chaos-gated)
    description: |
      HikariCP pool signals from ledger-service OTel metrics
      (db.client.connections.*). Steady state reports 0; real values surface
      only while db-slow or payment-meltdown act-1 is injected so the Postgres
      L4 node flips red during Act 1 without false positives at baseline.
    base_search: |
      | mstats max(_value) AS v
          WHERE index=itsi_im_metrics
                metric_name IN (
                  "db.client.connections.usage",
                  "db.client.connections.pending_requests",
                  "db.client.connections.timeouts"
                )
                service.name="ledger-service"
          BY metric_name state span=1m
      | eval actual_pool_used = case(
            metric_name="db.client.connections.usage" AND state="used", v),
             actual_pool_pending = case(
            metric_name="db.client.connections.pending_requests", v),
             actual_pool_timeouts_total = case(
            metric_name="db.client.connections.timeouts", v)
      | stats max(actual_pool_used) AS actual_pool_used,
              max(actual_pool_pending) AS actual_pool_pending,
              max(actual_pool_timeouts_total) AS actual_pool_timeouts_total
              BY _time
      | streamstats current=t window=2
              range(actual_pool_timeouts_total) AS pool_timeouts_per_min
      | eval pool_timeouts_per_min = coalesce(pool_timeouts_per_min, 0)
      | appendcols [
          search index=nwpay_audit sourcetype="nwpay:chaos"
            (scenario="db-slow" OR scenario="payment-meltdown")
            earliest=-7d
          | sort - _time
          | head 1
          | eval chaos_active=if(action="inject", 1, 0)
          | fields chaos_active
        ]
      | eval chaos_active=coalesce(chaos_active, 0),
             pool_used = if(chaos_active=1, actual_pool_used, 0),
             pool_pending = if(chaos_active=1, actual_pool_pending, 0),
             pool_timeouts_per_min = if(chaos_active=1, pool_timeouts_per_min, 0)
      | fields _time, pool_used, pool_pending, pool_timeouts_per_min
    metrics:
      - id: pool_used
        title: JDBC pool in use
        unit: count
        threshold_field: pool_used
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: pool_pending
        title: JDBC pool pending
        unit: count
        threshold_field: pool_pending
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: pool_timeouts_per_min
        title: JDBC connection timeouts / min
        unit: count
        threshold_field: pool_timeouts_per_min
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown

  # -----------------------------------------------------------------------
  # Postgres backends online (chaos-gated). Reports real pg_stat_database
  # numbackends only during postgres-outage / payment-meltdown; steady state
  # reports 10 (above critical_low) so the KPI stays green until Act 2.
  # -----------------------------------------------------------------------
  - id: kbs_postgres_backends_chaos_gated
    title: Postgres backends online (chaos-gated)
    description: |
      Active backends on the ledger database. Steady state reports 10;
      real backend count surfaces only while postgres-outage or
      payment-meltdown is injected so backends=0 trips critical during Act 2.
    base_search: |
      | mstats latest(_value) AS actual_backends
          WHERE index=itsi_im_metrics
                metric_name="pg_stat_database_numbackends"
                datname="ledger"
          span=1m
      | appendcols [
          search index=nwpay_audit sourcetype="nwpay:chaos"
            (scenario="postgres-outage" OR scenario="payment-meltdown")
            earliest=-7d
          | sort - _time
          | head 1
          | eval chaos_active=if(action="inject", 1, 0)
          | fields chaos_active
        ]
      | eval chaos_active=coalesce(chaos_active, 0),
             backends = if(chaos_active=1, actual_backends, 10)
      | fields _time, backends
    entity_alias_filtering_fields: pg_database
    entity_breakdown: true
    metrics:
      - id: backends
        title: backends online
        unit: count
        threshold_field: backends
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown

  # -----------------------------------------------------------------------
  # Kafka health KPIs (native kafkametrics receiver + jmx_exporter).
  # Eight numeric metrics covering broker liveness, replication, latency,
  # throughput, and controller / partition pathology:
  #   * brokers_online           - counts of active brokers (= 1 in demo)
  #   * under_replicated         - non-zero indicates broker / disk issue
  #   * request_p99_ms           - produce request latency 99p
  #   * messages_in_per_sec      - producer-side throughput (payments.settled)
  #   * bytes_in_per_sec         - broker ingress bandwidth (capacity)
  #   * offline_partitions       - should ALWAYS be 0 (broker death / disk full)
  #   * active_controller_count  - should ALWAYS be exactly 1 (split-brain)
  #   * isr_shrinks_per_min      - replica churn (flapping followers)
  #
  # messages-in and bytes-in are pulled from kafka_server_brokertopicmetrics_*_oneminuterate
  # (a JMX exporter gauge that already gives us a per-sec value) rather
  # than from the *_count counter, so no streamstats range() is required.
  # isr_shrinks_per_min IS derived from the cumulative *_count counter via
  # streamstats range() because the 1m gauge equivalent is too lossy.
  # -----------------------------------------------------------------------
  - id: kbs_kafka_health
    title: Kafka health (brokers, replication, latency, throughput, controller)
    description: |
      Eight Kafka health signals. Drives the L4 nwpay_l4_kafka KPIs (in
      addition to the existing consumer-lag KPI). Latency comes from the
      JMX exporter's RequestMetrics MBean.

      itsi_im_metrics is a metric-type index; the read path uses
      `| mstats`. We compute avg+max+sum in a single mstats call and
      pivot on metric_name so either the native kafkametrics receiver
      names (kafka.*) or the JMX exporter names
      (kafka_server_replicamanager_*, kafka_network_requestmetrics_*,
      kafka_server_brokertopicmetrics_*, kafka_controller_*) populate
      the same output columns.

      Entity breakdown splits on the JMX scrape target
      (`service.instance.id`, e.g. kafka.natwest.svc.cluster.local:5556).
      The demo cluster runs a single combined controller+broker node.
    base_search: |
      | mstats avg(_value) AS v_avg, max(_value) AS v_max, sum(_value) AS v_sum
          WHERE index=itsi_im_metrics
                metric_name IN (
                  "kafka.brokers",
                  "kafka.partition.under_replicated",
                  "kafka_server_replicamanager_underreplicatedpartitions",
                  "kafka_network_requestmetrics_totaltimems_99thpercentile",
                  "kafka_server_brokertopicmetrics_messagesinpersec_oneminuterate",
                  "kafka_server_brokertopicmetrics_bytesinpersec_oneminuterate",
                  "kafka_controller_offlinepartitionscount",
                  "kafka_controller_activecontrollercount",
                  "kafka_server_replicamanager_isrshrinkspersec_count"
                )
          BY metric_name service.instance.id span=1m
      | eval kafka_instance = coalesce(nullif(service.instance.id, ""),
                                     "kafka.natwest.svc.cluster.local:5556")
      | eval brokers_online           = case(metric_name="kafka.brokers", v_avg),
             under_replicated         = case(metric_name IN ("kafka.partition.under_replicated","kafka_server_replicamanager_underreplicatedpartitions"), v_max),
             request_p99_ms           = case(metric_name="kafka_network_requestmetrics_totaltimems_99thpercentile", v_max),
             messages_in_per_sec      = case(metric_name="kafka_server_brokertopicmetrics_messagesinpersec_oneminuterate", v_sum),
             bytes_in_per_sec         = case(metric_name="kafka_server_brokertopicmetrics_bytesinpersec_oneminuterate", v_sum),
             offline_partitions       = case(metric_name="kafka_controller_offlinepartitionscount", v_max),
             active_controller_count  = case(metric_name="kafka_controller_activecontrollercount", v_max),
             isr_shrinks_total        = case(metric_name="kafka_server_replicamanager_isrshrinkspersec_count", v_max)
      | stats avg(brokers_online)          AS brokers_online,
              max(under_replicated)        AS under_replicated,
              max(request_p99_ms)          AS request_p99_ms,
              max(messages_in_per_sec)     AS messages_in_per_sec,
              max(bytes_in_per_sec)        AS bytes_in_per_sec,
              max(offline_partitions)      AS offline_partitions,
              max(active_controller_count) AS active_controller_count,
              max(isr_shrinks_total)       AS isr_shrinks_total
              BY _time, kafka_instance
      | streamstats current=t window=2 range(isr_shrinks_total) AS isr_shrinks_per_min
              by kafka_instance
      | eval brokers_online          = coalesce(brokers_online, 0),
             under_replicated        = coalesce(under_replicated, 0),
             request_p99_ms          = coalesce(request_p99_ms, 0),
             messages_in_per_sec     = coalesce(messages_in_per_sec, 0),
             bytes_in_per_sec        = coalesce(bytes_in_per_sec, 0),
             offline_partitions      = coalesce(offline_partitions, 0),
             active_controller_count = coalesce(active_controller_count, 0),
             isr_shrinks_per_min     = coalesce(isr_shrinks_per_min, 0)
    entity_alias_filtering_fields: kafka_instance
    entity_breakdown: true
    metrics:
      - id: brokers_online
        title: brokers online
        unit: count
        threshold_field: brokers_online
        aggregate_statop: min
        entity_statop:    min
        gap_severity:     unknown
      - id: messages_in_per_sec
        title: messages-in / sec
        unit: rate
        threshold_field: messages_in_per_sec
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown
      - id: bytes_in_per_sec
        title: bytes-in / sec
        unit: bytes
        threshold_field: bytes_in_per_sec
        aggregate_statop: avg
        entity_statop:    avg
        gap_severity:     unknown
      - id: offline_partitions
        title: offline partitions
        unit: count
        threshold_field: offline_partitions
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: active_controller_count
        title: active controllers
        unit: count
        threshold_field: active_controller_count
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: isr_shrinks_per_min
        title: ISR shrinks / min
        unit: count
        threshold_field: isr_shrinks_per_min
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: under_replicated
        title: under-replicated partitions
        unit: count
        threshold_field: under_replicated
        aggregate_statop: max
        entity_statop:    max
        gap_severity:     unknown
      - id: request_p99_ms
        title: request p99 latency
        unit: ms
        threshold_field: request_p99_ms
        aggregate_statop: max
