# Values override for the London/eu-west-1 build in Craig's account (445740536021).
# Image repos repointed to Craig's ECR; per-service tag overrides match the
# exact deployed tags. Secrets/tokens passed via --set at deploy time (NOT here).
image:
  repository: 445740536021.dkr.ecr.eu-west-1.amazonaws.com/natwest-payments-service
  tag: "0.1.6"
  pullPolicy: IfNotPresent

services:
  # sanctions-aml runs the madrid-rca variant (only service on a different tag)
  sanctions-aml-service:
    image:
      repository: 445740536021.dkr.ecr.eu-west-1.amazonaws.com/natwest-payments-service
      tag: "0.1.9-madrid-rca"
  ledger-service:
    image:
      repository: 445740536021.dkr.ecr.eu-west-1.amazonaws.com/natwest-payments-ledger-service-java
      tag: "0.1.7"

frontend:
  enabled: true
  image:
    repository: 445740536021.dkr.ecr.eu-west-1.amazonaws.com/natwest-payments-web-frontend
    tag: "0.7.9-partialfail"
  service:
    type: NodePort
    nodePort: 30598
  rum:
    realm: "eu2"
    # accessToken via --set frontend.rum.accessToken=<eu2 RUM token>
    applicationName: "natwest-payments-web"
    deploymentEnvironment: "demo"
  auth:
    enabled: true
    username: "admin"
    # password via --set frontend.auth.password=<demo pw>

chaosController:
  enabled: true
  image:
    repository: 445740536021.dkr.ecr.eu-west-1.amazonaws.com/natwest-payments-chaos-controller
    tag: "0.1.12-aml-err90"
  # presenterToken + hec.* via --set at deploy time (HEC wired after Splunk box is up)

rumUserSimulator:
  enabled: true
  image:
    repository: 445740536021.dkr.ecr.eu-west-1.amazonaws.com/natwest-payments-rum-user-simulator
    tag: "0.1.4"
  # spaUrl left default (internal) initially; repoint to public URL after nginx is up
