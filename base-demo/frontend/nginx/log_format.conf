# JSON access log format for the SPA + /api/ reverse proxy.
#
# Lives in /etc/nginx/conf.d/ so nginx loads it inside the http {} context
# (where log_format must be declared). The 00- prefix on the installed
# filename forces lexicographic ordering ahead of default.conf, otherwise
# default.conf could reference json_main before it is defined.
#
# Field choices:
#   * @timestamp / time_local: ISO-8601 + nginx local time so the Splunk
#     props.conf TIME_PREFIX="@timestamp" stanza in
#     terraform/cloud-init/splunk-enterprise.tftpl picks up the event time.
#   * trace_id / parent_request_id: surface W3C traceparent so the SPA log
#     line can pivot to the matching APM trace in Splunk Observability.
#   * upstream_response_time / upstream_status / upstream_addr: lets the
#     SOC see /api/* timing and decode upstream errors without enabling
#     the full debug log.
#   * Everything is escape=json so embedded quotes/CRLF do not break the
#     JSON document (CR/LF would otherwise also enable log injection -
#     codeguard-0-logging "Sanitize all log inputs to prevent log injection").
log_format json_main escape=json
  '{'
    '"@timestamp":"$time_iso8601",'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"http_host":"$host",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_id":"$request_id",'
    '"trace_id":"$http_traceparent",'
    '"server_name":"$server_name"'
  '}';
