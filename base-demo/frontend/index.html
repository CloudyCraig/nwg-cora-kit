<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NatWest Payments (Demo)</title>
    <link rel="icon" type="image/png" href="/natwest-logo.png" />
    <!--
      Runtime config is rendered by nginx from a ConfigMap-mounted template
      (see helm/natwest-payments/templates/web-frontend.yaml). It defines
      window.__APP_CONFIG__ with rumRealm, rumAccessToken, applicationName,
      deploymentEnvironment and gatewayUrl, all of which are read by
      src/rum.ts before React mounts.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
