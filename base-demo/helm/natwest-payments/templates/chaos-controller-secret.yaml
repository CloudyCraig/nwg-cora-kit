{{- if (.Values.chaosController).enabled }}
{{- if not .Values.chaosController.presenterToken }}
{{- fail "chaosController.enabled=true requires chaosController.presenterToken to be set (pass via --set; NEVER commit to values.yaml). Use scripts/05c-chaos-controller.sh which generates one if missing." }}
{{- end }}
# Opaque Secret with the shared presenter token. Mounted into the
# chaos-controller pod via a file path (CHAOS_PRESENTER_TOKEN_PATH) so
# the token never appears as an env var in `kubectl describe pod`
# output. Plaintext provenance: scripts/05c-chaos-controller.sh
# generates `openssl rand -hex 24` when .env does not pin a value.
apiVersion: v1
kind: Secret
metadata:
  name: chaos-controller-token
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: chaos-controller
    app.kubernetes.io/component: chaos-controller
    app.kubernetes.io/part-of: natwest-payments
type: Opaque
stringData:
  CHAOS_PRESENTER_TOKEN: {{ .Values.chaosController.presenterToken | quote }}
  # HEC values may be empty (audit emitter degrades gracefully). When
  # set they ship `nwpay:chaos` events identical-shape to
  # scripts/incident.sh::emit_chaos_audit so the existing SIEM
  # correlation searches keep working.
  SPLUNK_HEC_ENDPOINT: {{ .Values.chaosController.hec.endpoint | default "" | quote }}
  SPLUNK_HEC_TOKEN: {{ .Values.chaosController.hec.token | default "" | quote }}
  SPLUNK_HEC_INDEX: {{ .Values.chaosController.hec.index | default "nwpay_audit" | quote }}
  SPLUNK_HEC_INSECURE: {{ .Values.chaosController.hec.insecure | default "1" | quote }}
{{- end }}
