{{- if .Values.statusPage.enabled }}
{{- $port := .Values.statusPage.port | default 8080 -}}
{{- $nodePort := .Values.statusPage.nodePort | default 30702 -}}
---
# Customer-facing public status page (StatusPage.io / status.natwest.com
# style). Renders the current health of the demo's customer-facing
# product surfaces in plain language, sourced from the in-cluster
# ServiceNow simulator's incidents API. Closes the "external comms"
# gap in the incident-response narrative: detection -> ITSI Episode
# -> ServiceNow ticket -> SOAR auto-remediation -> public status
# page update -- all in one cluster.
#
# Implementation mirrors the snow / soar simulator pattern: stdlib
# only, read-only-rootfs, non-root user. Polls the snow-simulator
# /api/now/v1/incidents endpoint on each page render (cheap; the
# simulator's tickets list lives in memory and the request is
# in-cluster).
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-page-app
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: status-page
    app.kubernetes.io/part-of: natwest-payments
data:
  server.py: |
    """Public status page for the NatWest payments demo.

    GET  /          - branded HTML status page (auto-refresh 30s)
    GET  /api/state - JSON with the same data the page renders
    GET  /healthz   - readiness probe

    The list of customer-facing surfaces is hard-coded (this is a
    public page; nobody wants the back-office observability stack
    leaked here). Each surface is mapped to a string the
    snow-simulator ticket title may contain; if any open ticket
    matches the surface its status flips to degraded / down based on
    the ticket severity.
    """
    from __future__ import annotations

    import json
    import os
    import sys
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from typing import Any
    from urllib.parse import urlparse

    PORT = int(os.environ.get("STATUS_PORT", "8080"))
    SNOW_URL = os.environ.get("SNOW_URL", "").strip()
    REFRESH_S = int(os.environ.get("STATUS_REFRESH_S", "30"))
    ENVIRONMENT = os.environ.get("DEMO_ENVIRONMENT", "demo")

    # Customer-facing surfaces. Each tuple: (display name, slug,
    # match_substrings list). The slugs are stable so a customer can
    # bookmark anchors; the match_substrings are checked against
    # ticket titles to determine current status.
    SURFACES = [
        ("Card payments (FPS / CHAPS / SWIFT)", "card-payments", ["payment", "swift", "fps", "chaps", "settle"]),
        ("Open Banking (PSD2 AISP / PISP)",     "open-banking",  ["open banking", "tpp", "psd2", "consent"]),
        ("Mobile banking app",                  "mobile",        ["mobile", "ios", "android"]),
        ("Online banking",                       "online",        ["online", "spa", "frontend", "web"]),
        ("ATM estate",                           "atm",           ["atm"]),
        ("Sanctions / fraud screening",         "fincrime",      ["sanctions", "fraud"]),
    ]

    # Ticket severity -> display status. Anything not listed is
    # "Operational".
    SEV_STATUS = {
        "critical": ("Major outage",      "#B50101"),
        "high":     ("Major outage",      "#B50101"),
        "major":    ("Partial outage",    "#F58F39"),
        "warning":  ("Degraded",          "#F8BE34"),
        "minor":    ("Degraded",          "#F8BE34"),
        "info":     ("Operational",       "#99D18B"),
    }


    def _fetch_tickets() -> list[dict[str, Any]]:
        if not SNOW_URL:
            return []
        try:
            req = urllib.request.Request(
                SNOW_URL.rstrip("/") + "/api/now/v1/incidents",
                method="GET",
            )
            with urllib.request.urlopen(req, timeout=4) as resp:
                body = json.loads(resp.read().decode("utf-8"))
            tickets = body.get("result") or []
            return [t for t in tickets if isinstance(t, dict)]
        except Exception:
            return []


    def _surface_state(tickets: list[dict[str, Any]]) -> list[dict[str, Any]]:
        out = []
        for name, slug, needles in SURFACES:
            status_label = "Operational"
            colour = "#99D18B"
            matched_ticket: dict[str, Any] | None = None
            for t in tickets:
                if t.get("status") == "closed":
                    continue
                title_l = str(t.get("title", "")).lower()
                if any(needle in title_l for needle in needles):
                    sev = str(t.get("severity", "warning")).lower()
                    label, col = SEV_STATUS.get(sev, ("Degraded", "#F8BE34"))
                    if matched_ticket is None or _sev_rank(sev) > _sev_rank(matched_ticket.get("severity", "info")):
                        matched_ticket = t
                        status_label = label
                        colour = col
            entry = {
                "name":   name,
                "slug":   slug,
                "status": status_label,
                "colour": colour,
            }
            if matched_ticket is not None:
                entry["incident_id"] = matched_ticket.get("ticket_id")
                entry["incident_title"] = matched_ticket.get("title")
            out.append(entry)
        return out


    def _sev_rank(sev: str) -> int:
        return {"critical": 4, "high": 4, "major": 3, "warning": 2, "minor": 2, "info": 1}.get(sev.lower(), 0)


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt: str, *args: Any) -> None:
            return

        def _send(self, code: int, body: bytes, ctype: str) -> None:
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-store")
            self.send_header("X-Content-Type-Options", "nosniff")
            self.send_header("X-Frame-Options", "SAMEORIGIN")
            self.send_header("Referrer-Policy", "no-referrer")
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self) -> None:
            path = urlparse(self.path).path
            if path == "/healthz":
                self._send(200, b'{"ok":true}', "application/json")
                return
            tickets = _fetch_tickets()
            surfaces = _surface_state(tickets)
            if path == "/api/state":
                payload = json.dumps({
                    "environment": ENVIRONMENT,
                    "surfaces":    surfaces,
                    "as_of":       time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                }).encode("utf-8")
                self._send(200, payload, "application/json")
                return
            if path in {"/", "/index.html"}:
                self._send(200, _render_html(surfaces), "text/html; charset=utf-8")
                return
            self._send(404, b'{"error":"not found"}', "application/json")


    def _render_html(surfaces: list[dict[str, Any]]) -> bytes:
        any_incident = any(s["status"] != "Operational" for s in surfaces)
        banner_text = "All systems operational" if not any_incident else "We are aware of an active service issue"
        banner_colour = "#99D18B" if not any_incident else "#F58F39"
        rows = []
        for s in surfaces:
            badge = (
                '<span class="badge" style="background:' + s["colour"] + '">'
                + s["status"] + "</span>"
            )
            sub = ""
            if s.get("incident_title"):
                sub = (
                    '<div class="sub">'
                    + 'Active incident '
                    + str(s.get("incident_id") or "")
                    + ': ' + str(s["incident_title"])
                    + '</div>'
                )
            rows.append(
                '<li id="' + s["slug"] + '">'
                '<div class="surface"><span class="name">' + s["name"] + '</span>'
                + badge + '</div>' + sub + '</li>'
            )
        html = (
            '<!doctype html><html><head><meta charset="utf-8">'
            '<title>NatWest Payments &mdash; service status</title>'
            '<meta http-equiv="refresh" content="' + str(REFRESH_S) + '">'
            '<meta name="viewport" content="width=device-width,initial-scale=1">'
            '<style>'
            'body{font-family:-apple-system,Segoe UI,sans-serif;margin:0;background:#f7f5fb;color:#1f2937;}'
            'header{background:linear-gradient(90deg,#5A287D,#3B1A52);padding:24px 32px;color:#fff;}'
            'header h1{margin:0;font-size:24px;font-weight:700;}'
            'header p{margin:6px 0 0;color:#dcd0e8;font-size:13px;}'
            '.banner{padding:18px 32px;color:#0b1220;font-weight:600;font-size:16px;}'
            'main{max-width:880px;margin:0 auto;padding:24px 32px;}'
            'ul{list-style:none;padding:0;margin:0;}'
            'li{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;margin-bottom:10px;}'
            '.surface{display:flex;justify-content:space-between;align-items:center;}'
            '.name{font-weight:600;font-size:15px;}'
            '.badge{padding:4px 12px;border-radius:14px;color:#fff;font-size:12px;font-weight:600;letter-spacing:.3px;}'
            '.sub{margin-top:8px;font-size:13px;color:#6b7280;}'
            'footer{padding:24px 32px;color:#94a3b8;font-size:12px;text-align:center;}'
            '</style></head><body>'
            '<header><h1>NatWest payments &mdash; service status</h1>'
            '<p>Real-time view of public-facing card payment services. Data refreshes every '
            + str(REFRESH_S) + ' seconds.</p></header>'
            '<div class="banner" style="background:' + banner_colour + '20;border-bottom:3px solid '
            + banner_colour + ';">' + banner_text + '</div>'
            '<main><ul>' + "".join(rows) + '</ul></main>'
            '<footer>Status data sourced from internal incident-management system. Environment: '
            + ENVIRONMENT + '. Last refreshed ' + time.strftime("%H:%M:%S UTC", time.gmtime())
            + '.</footer></body></html>'
        )
        return html.encode("utf-8")


    def main() -> None:
        server = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)
        sys.stdout.write(json.dumps({
            "event_type": "status_page_start",
            "port": PORT,
            "snow_url": SNOW_URL or "(unset)",
            "environment": ENVIRONMENT,
        }) + "\n")
        sys.stdout.flush()
        try:
            server.serve_forever()
        finally:
            server.server_close()


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: status-page
    app.kubernetes.io/part-of: natwest-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: status-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-page
        app.kubernetes.io/part-of: natwest-payments
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ .Values.statusPage.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/server.py"]
          env:
            - name: STATUS_PORT
              value: "{{ $port }}"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DEMO_ENVIRONMENT
              value: {{ .Values.otel.environment | quote }}
            {{- if .Values.snowSimulator.enabled }}
            - name: SNOW_URL
              value: "http://snow-simulator.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.snowSimulator.port | default 8080 }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: "10m",  memory: "32Mi" }
            limits:   { cpu: "100m", memory: "96Mi" }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: status-page-app
---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: status-page
    app.kubernetes.io/part-of: natwest-payments
spec:
  type: {{ .Values.statusPage.serviceType | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: status-page
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      {{- if eq (.Values.statusPage.serviceType | default "ClusterIP") "NodePort" }}
      nodePort: {{ $nodePort }}
      {{- end }}
{{- end }}
