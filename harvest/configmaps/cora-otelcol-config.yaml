apiVersion: v1
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
      memory_limiter:
        check_interval: 2s
        limit_mib: 200
    exporters:
      # Metrics -> org HB_UFNBCsAw (the main NWG demo org, AI monitoring enabled
      # 2026-09-03). send_otlp_histograms keeps gen_ai.* histograms NATIVE - the
      # plain metric names are virgin in this org and must only ever receive
      # native histograms (legacy-translated suffixed series from the node
      # collector's primary path are a different name family; harmless).
      signalfx:
        access_token: "${SPLUNK_ACCESS_TOKEN}"
        realm: "eu2"
        send_otlp_histograms: true
      # Traces -> same org, via THIS collector's token. The AI trace pipeline
      # only processes spans ingested with an ai_monitoring-capable token, so
      # Cora's spans must enter through here, not the node collector. The app's
      # OTEL_EXPORTER_OTLP_ENDPOINT points at cora-otelcol (2026-09-03) so this
      # is the ONLY span path - no duplicates.
      otlphttp:
        traces_endpoint: "https://ingest.eu2.signalfx.com/v2/trace/otlp"
        headers:
          X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [signalfx]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp]
kind: ConfigMap
