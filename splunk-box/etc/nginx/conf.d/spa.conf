# Generated by scripts/05b-frontend-public-proxy.sh on 2026-06-04T11:00:31Z
# Do not hand-edit: rerun the script to refresh upstream IPs after a node-group roll.

upstream natwest_web_frontend {
    server 172.31.170.128:30598 max_fails=2 fail_timeout=10s;
    server 172.31.177.234:30598 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

upstream natwest_api_gateway {
    server 172.31.170.128:30680 max_fails=2 fail_timeout=10s;
    server 172.31.177.234:30680 max_fails=2 fail_timeout=10s;
    # keepalive off: avoid stale NodePort conn resets on POST
}

# JSON access log for the public SPA proxy. Mirrors the in-cluster
# web-frontend log format (see frontend/nginx/log_format.conf) so a
# downstream Splunk index parses both with the same props.conf stanza
# (sourcetype=nginx:access, index=nwpay_infra). escape=json prevents
# log-injection via embedded CRLF/quotes (codeguard-0-logging).
log_format spa_proxy_json escape=json
  '{'
    '"@timestamp":"$time_iso8601",'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"http_host":"$host",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_id":"$request_id"'
  '}';

server {
    server_name nwg.crgpov.com;
    # ThousandEyes -> HEC via HTTPS/443 (proxied to the local HEC listener on 8088)
    location /services/collector {
        proxy_pass https://127.0.0.1:8088;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    access_log /var/log/nginx/spa-access.log spa_proxy_json;
    error_log  /var/log/nginx/spa-error.log warn;

    # Tight defaults; the SPA is fully client-rendered so requests are short-
    # lived. Long enough that /process can complete (api-gateway is the slow
    # path, ~6s on tail-latency injections).
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    30s;

    # Forwarded headers so the api-gateway sees the original client IP /
    # scheme. Useful for RUM/APM correlation.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # /api/* -> api-gateway NodePort. Strip the /api prefix so the gateway
    # sees the same path it would in-cluster.
    location ^~ /wallboard/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_next_upstream error timeout non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_pass http://natwest_api_gateway;
    }

    # Health endpoint that bypasses the upstream so launchd/curl probes can
    # confirm nginx itself is alive even when the cluster is rolling.
    location = /__proxy_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else -> web-frontend NodePort (which serves the React bundle
    # and also handles its own /api/* fallback for in-cluster RUM hits).
    location / {
        proxy_pass http://natwest_web_frontend;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nwg.crgpov.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nwg.crgpov.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    listen 80 default_server;
    server_name nwg.crgpov.com;

    # Local health endpoint for natwest-spa-watchdog (probes via
    # http://127.0.0.1, so it must live on the port-80 vhost and must not
    # be short-circuited by a server-level return). Restored 2026-09-04:
    # certbot's --nginx rewrite had replaced this block with a bare
    # server-level "return 404", which made the watchdog restart nginx
    # every ~60s for weeks.
    location = /__proxy_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        if ($host = nwg.crgpov.com) {
            return 301 https://$host$request_uri;
        } # managed by Certbot
        return 404; # managed by Certbot
    }
}