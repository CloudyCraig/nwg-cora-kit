      if __name__ == "__main__":
          main()
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"server.py":"\"\"\"Public status page for the NatWest payments demo.\n\nGET  /          - branded HTML status page (auto-refresh 30s)\nGET  /api/state - JSON with the same data the page renders\nGET  /healthz   - readiness probe\n\nThe list of customer-facing surfaces is hard-coded (this is a\npublic page; nobody wants the back-office observability stack\nleaked here). Each surface is mapped to a string the\nsnow-simulator ticket title may contain; if any open ticket\nmatches the surface its status flips to degraded / down based on\nthe ticket severity.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport os\nimport sys\nimport time\nimport urllib.request\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom typing import Any\nfrom urllib.parse import urlparse\n\nPORT = int(os.environ.get(\"STATUS_PORT\", \"8080\"))\nSNOW_URL = os.environ.get(\"SNOW_URL\", \"\").strip()\nREFRESH_S = int(os.environ.get(\"STATUS_REFRESH_S\", \"30\"))\nENVIRONMENT = os.environ.get(\"DEMO_ENVIRONMENT\", \"demo\")\n\n# Customer-facing surfaces. Each tuple: (display name, slug,\n# match_substrings list). The slugs are stable so a customer can\n# bookmark anchors; the match_substrings are checked against\n# ticket titles to determine current status.\nSURFACES = [\n    (\"Card payments (FPS / CHAPS / SWIFT)\", \"card-payments\", [\"payment\", \"swift\", \"fps\", \"chaps\", \"settle\"]),\n    (\"Open Banking (PSD2 AISP / PISP)\",     \"open-banking\",  [\"open banking\", \"tpp\", \"psd2\", \"consent\"]),\n    (\"Mobile banking app\",                  \"mobile\",        [\"mobile\", \"ios\", \"android\"]),\n    (\"Online banking\",                       \"online\",        [\"online\", \"spa\", \"frontend\", \"web\"]),\n    (\"ATM estate\",                           \"atm\",           [\"atm\"]),\n    (\"Sanctions / fraud screening\",         \"fincrime\",      [\"sanctions\", \"fraud\"]),\n]\n\n# Ticket severity -\u003e display status. Anything not listed is\n# \"Operational\".\nSEV_STATUS = {\n    \"critical\": (\"Major outage\",      \"#B50101\"),\n    \"high\":     (\"Major outage\",      \"#B50101\"),\n    \"major\":    (\"Partial outage\",    \"#F58F39\"),\n    \"warning\":  (\"Degraded\",          \"#F8BE34\"),\n    \"minor\":    (\"Degraded\",          \"#F8BE34\"),\n    \"info\":     (\"Operational\",       \"#99D18B\"),\n}\n\n\ndef _fetch_tickets() -\u003e list[dict[str, Any]]:\n    if not SNOW_URL:\n        return []\n    try:\n        req = urllib.request.Request(\n            SNOW_URL.rstrip(\"/\") + \"/api/now/v1/incidents\",\n            method=\"GET\",\n        )\n        with urllib.request.urlopen(req, timeout=4) as resp:\n            body = json.loads(resp.read().decode(\"utf-8\"))\n        tickets = body.get(\"result\") or []\n        return [t for t in tickets if isinstance(t, dict)]\n    except Exception:\n        return []\n\n\ndef _surface_state(tickets: list[dict[str, Any]]) -\u003e list[dict[str, Any]]:\n    out = []\n    for name, slug, needles in SURFACES:\n        status_label = \"Operational\"\n        colour = \"#99D18B\"\n        matched_ticket: dict[str, Any] | None = None\n        for t in tickets:\n            if t.get(\"status\") == \"closed\":\n                continue\n            title_l = str(t.get(\"title\", \"\")).lower()\n            if any(needle in title_l for needle in needles):\n                sev = str(t.get(\"severity\", \"warning\")).lower()\n                label, col = SEV_STATUS.get(sev, (\"Degraded\", \"#F8BE34\"))\n                if matched_ticket is None or _sev_rank(sev) \u003e _sev_rank(matched_ticket.get(\"severity\", \"info\")):\n                    matched_ticket = t\n                    status_label = label\n                    colour = col\n        entry = {\n            \"name\":   name,\n            \"slug\":   slug,\n            \"status\": status_label,\n            \"colour\": colour,\n        }\n        if matched_ticket is not None:\n            entry[\"incident_id\"] = matched_ticket.get(\"ticket_id\")\n            entry[\"incident_title\"] = matched_ticket.get(\"title\")\n        out.append(entry)\n    return out\n\n\ndef _sev_rank(sev: str) -\u003e int:\n    return {\"critical\": 4, \"high\": 4, \"major\": 3, \"warning\": 2, \"minor\": 2, \"info\": 1}.get(sev.lower(), 0)\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def log_message(self, fmt: str, *args: Any) -\u003e None:\n        return\n\n    def _send(self, code: int, body: bytes, ctype: str) -\u003e None:\n        self.send_response(code)\n        self.send_header(\"Content-Type\", ctype)\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.send_header(\"Cache-Control\", \"no-store\")\n        self.send_header(\"X-Content-Type-Options\", \"nosniff\")\n        self.send_header(\"X-Frame-Options\", \"SAMEORIGIN\")\n        self.send_header(\"Referrer-Policy\", \"no-referrer\")\n        self.end_headers()\n        self.wfile.write(body)\n\n    def do_GET(self) -\u003e None:\n        path = urlparse(self.path).path\n        if path == \"/healthz\":\n            self._send(200, b'{\"ok\":true}', \"application/json\")\n            return\n        tickets = _fetch_tickets()\n        surfaces = _surface_state(tickets)\n        if path == \"/api/state\":\n            payload = json.dumps({\n                \"environment\": ENVIRONMENT,\n                \"surfaces\":    surfaces,\n                \"as_of\":       time.strftime(\"%Y-%m-%dT%H:%M:%SZ\", time.gmtime()),\n            }).encode(\"utf-8\")\n            self._send(200, payload, \"application/json\")\n            return\n        if path in {\"/\", \"/index.html\"}:\n            self._send(200, _render_html(surfaces), \"text/html; charset=utf-8\")\n            return\n        self._send(404, b'{\"error\":\"not found\"}', \"application/json\")\n\n\ndef _render_html(surfaces: list[dict[str, Any]]) -\u003e bytes:\n    any_incident = any(s[\"status\"] != \"Operational\" for s in surfaces)\n    banner_text = \"All systems operational\" if not any_incident else \"We are aware of an active service issue\"\n    banner_colour = \"#99D18B\" if not any_incident else \"#F58F39\"\n    rows = []\n    for s in surfaces:\n        badge = (\n            '\u003cspan class=\"badge\" style=\"background:' + s[\"colour\"] + '\"\u003e'\n            + s[\"status\"] + \"\u003c/span\u003e\"\n        )\n        sub = \"\"\n        if s.get(\"incident_title\"):\n            sub = (\n                '\u003cdiv class=\"sub\"\u003e'\n                + 'Active incident '\n                + str(s.get(\"incident_id\") or \"\")\n                + ': ' + str(s[\"incident_title\"])\n                + '\u003c/div\u003e'\n            )\n        rows.append(\n            '\u003cli id=\"' + s[\"slug\"] + '\"\u003e'\n            '\u003cdiv class=\"surface\"\u003e\u003cspan class=\"name\"\u003e' + s[\"name\"] + '\u003c/span\u003e'\n            + badge + '\u003c/div\u003e' + sub + '\u003c/li\u003e'\n        )\n    html = (\n        '\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e'\n        '\u003ctitle\u003eNatWest Payments \u0026mdash; service status\u003c/title\u003e'\n        '\u003cmeta http-equiv=\"refresh\" content=\"' + str(REFRESH_S) + '\"\u003e'\n        '\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e'\n        '\u003cstyle\u003e'\n        'body{font-family:-apple-system,Segoe UI,sans-serif;margin:0;background:#f7f5fb;color:#1f2937;}'\n        'header{background:linear-gradient(90deg,#5A287D,#3B1A52);padding:24px 32px;color:#fff;}'\n        'header h1{margin:0;font-size:24px;font-weight:700;}'\n        'header p{margin:6px 0 0;color:#dcd0e8;font-size:13px;}'\n        '.banner{padding:18px 32px;color:#0b1220;font-weight:600;font-size:16px;}'\n        'main{max-width:880px;margin:0 auto;padding:24px 32px;}'\n        'ul{list-style:none;padding:0;margin:0;}'\n        'li{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;margin-bottom:10px;}'\n        '.surface{display:flex;justify-content:space-between;align-items:center;}'\n        '.name{font-weight:600;font-size:15px;}'\n        '.badge{padding:4px 12px;border-radius:14px;color:#fff;font-size:12px;font-weight:600;letter-spacing:.3px;}'\n        '.sub{margin-top:8px;font-size:13px;color:#6b7280;}'\n        'footer{padding:24px 32px;color:#94a3b8;font-size:12px;text-align:center;}'\n        '\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e'\n        '\u003cheader\u003e\u003ch1\u003eNatWest payments \u0026mdash; service status\u003c/h1\u003e'\n        '\u003cp\u003eReal-time view of public-facing card payment services. Data refreshes every '\n        + str(REFRESH_S) + ' seconds.\u003c/p\u003e\u003c/header\u003e'\n        '\u003cdiv class=\"banner\" style=\"background:' + banner_colour + '20;border-bottom:3px solid '\n        + banner_colour + ';\"\u003e' + banner_text + '\u003c/div\u003e'\n        '\u003cmain\u003e\u003cul\u003e' + \"\".join(rows) + '\u003c/ul\u003e\u003c/main\u003e'\n        '\u003cfooter\u003eStatus data sourced from internal incident-management system. Environment: '\n        + ENVIRONMENT + '. Last refreshed ' + time.strftime(\"%H:%M:%S UTC\", time.gmtime())\n        + '.\u003c/footer\u003e\u003c/body\u003e\u003c/html\u003e'\n    )\n    return html.encode(\"utf-8\")\n\n\ndef main() -\u003e None:\n    server = ThreadingHTTPServer((\"0.0.0.0\", PORT), Handler)\n    sys.stdout.write(json.dumps({\n        \"event_type\": \"status_page_start\",\n        \"port\": PORT,\n        \"snow_url\": SNOW_URL or \"(unset)\",\n        \"environment\": ENVIRONMENT,\n    }) + \"\\n\")\n    sys.stdout.flush()\n    try:\n        server.serve_forever()\n    finally:\n        server.server_close()\n\n\nif __name__ == \"__main__\":\n    main()\n"},"kind":"ConfigMap","metadata":{"annotations":{"meta.helm.sh/release-name":"natwest-payments","meta.helm.sh/release-namespace":"natwest"},"labels":{"app.kubernetes.io/managed-by":"Helm","app.kubernetes.io/name":"status-page","app.kubernetes.io/part-of":"natwest-payments"},"name":"status-page-app","namespace":"natwest"}}
