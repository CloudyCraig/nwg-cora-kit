ION IF NOT EXISTS pg_stat_statements;\n"},"kind":"ConfigMap","metadata":{"annotations":{"meta.helm.sh/release-name":"natwest-payments","meta.helm.sh/release-namespace":"natwest"},"labels":{"app.kubernetes.io/managed-by":"Helm","app.kubernetes.io/name":"postgres","app.kubernetes.io/part-of":"natwest-payments"},"name":"postgres-initdb","namespace":"natwest"}}
