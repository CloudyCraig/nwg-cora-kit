  kind: CronJob
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"batch/v1","kind":"CronJob","metadata":{"annotations":{"meta.helm.sh/release-name":"natwest-payments","meta.helm.sh/release-namespace":"natwest"},"labels":{"app.kubernetes.io/component":"instrumentation","app.kubernetes.io/managed-by":"Helm","app.kubernetes.io/name":"demo-events-emitter","app.kubernetes.io/part-of":"natwest-payments"},"name":"demo-events-emitter","namespace":"natwest"},"spec":{"concurrencyPolicy":"Forbid","failedJobsHistoryLimit":2,"jobTemplate":{"metadata":{"creationTimestamp":null},"spec":{"backoffLimit":0,"template":{"metadata":{"annotations":{"splunk.com/index":"nwpay_audit","splunk.com/sourcetype":"nwpay:demo_event"},"creationTimestamp":null,"labels":{"app.kubernetes.io/name":"demo-events-emitter","app.kubernetes.io/part-of":"natwest-payments"}},"spec":{"automountServiceAccountToken":false,"containers":[{"args":["set -eu\n\n# ----- helpers -----\nrand_int() {\n  # rand_int \u003cmax\u003e -\u003e uniform int in [0, max-1]\n  # busybox shell can't do $RANDOM reliably, so read\n  # 2 bytes from /dev/urandom and modulo.\n  local max=\"$1\"\n  local n\n  n=$(od -An -N2 -tu2 /dev/urandom | tr -d ' \\n')\n  echo $(( n % max ))\n}\nrand_hex() {\n  head -c \"$1\" /dev/urandom | od -An -tx1 | tr -d ' \\n'\n}\niso_now() {\n  date -u +%Y-%m-%dT%H:%M:%SZ\n}\nemit() {\n  # JSON-encode the rest of the args as one record.\n  # Each arg is \"key=value\"; values with spaces must\n  # be quoted in the call site, no embedded quotes.\n  local out='{\"@timestamp\":\"'\"$(iso_now)\"'\",\"environment\":\"'\"$DEMO_ENV\"'\",\"cluster\":\"'\"$K8S_CLUSTER\"'\"'\n  for kv in \"$@\"; do\n    key=\"${kv%%=*}\"\n    val=\"${kv#*=}\"\n    # Numeric heuristic: if val is all digits, emit unquoted.\n    case \"$val\" in\n      ''|*[!0-9]*) out=\"$out,\\\"$key\\\":\\\"$val\\\"\" ;;\n      *)           out=\"$out,\\\"$key\\\":$val\" ;;\n    esac\n  done\n  out=\"$out}\"\n  echo \"$out\"\n}\n\n# ----- 1. deploy event -----\n# Outcome distribution (default: 89.2% success, 8% rollback,\n# 3% fail). Tunable via DEPLOY_*_PERMILLE for the chaos\n# catalogue narrative.\nd=$(rand_int 1000)\nif [ \"$d\" -lt \"$DEPLOY_FAIL_PERMILLE\" ]; then\n  outcome=failed\nelif [ \"$d\" -lt $((DEPLOY_FAIL_PERMILLE + DEPLOY_ROLLBACK_PERMILLE)) ]; then\n  outcome=rolled_back\nelse\n  outcome=success\nfi\n# Pick a service from the topology (must mirror the\n# services map in values.yaml; trimmed to the user-\n# facing ones).\nsvc_idx=$(rand_int 9)\ncase $svc_idx in\n  0) service=api-gateway ;;\n  1) service=payment-initiation-service ;;\n  2) service=payment-validation-service ;;\n  3) service=fraud-detection-service ;;\n  4) service=sanctions-aml-service ;;\n  5) service=ledger-service ;;\n  6) service=settlement-service ;;\n  7) service=swift-network ;;\n  *) service=customer-profile-service ;;\nesac\npatch=$(rand_int 30)\nlead_time_min=$(( $(rand_int 180) + 15 ))\nduration_s=$(( $(rand_int 240) + 60 ))\nemit \\\n  event_type=deploy \\\n  service=\"$service\" \\\n  version=\"0.1.$patch\" \\\n  deploy_id=\"dep-$(rand_hex 6)\" \\\n  outcome=\"$outcome\" \\\n  lead_time_minutes=\"$lead_time_min\" \\\n  duration_seconds=\"$duration_s\" \\\n  actor=\"ci-bot\"\n\n# ----- 2. ATM estate status -----\n# Emit one event per ATM. ATM_COUNT defaults to 240\n# which roughly matches NatWest's branch-ATM count\n# in a major UK city, kept low enough to not spam\n# the indexer (240 events / 2 minutes = 2 EPS).\ni=0\nwhile [ \"$i\" -lt \"$ATM_COUNT\" ]; do\n  aid=$(printf 'atm-%04d' \"$i\")\n  # Status weighting: \u003cATM_OUTAGE_PERMILLE\u003e / 1000\n  # are degraded/down; the rest are healthy.\n  s=$(rand_int 1000)\n  if [ \"$s\" -lt \"$ATM_OUTAGE_PERMILLE\" ]; then\n    half=$((ATM_OUTAGE_PERMILLE / 2))\n    if [ \"$s\" -lt \"$half\" ]; then\n      status=down\n    else\n      status=degraded\n    fi\n  else\n    status=healthy\n  fi\n  region_idx=$(( i % 5 ))\n  case $region_idx in\n    0) region=London ;;\n    1) region=Manchester ;;\n    2) region=Edinburgh ;;\n    3) region=Birmingham ;;\n    *) region=Bristol ;;\n  esac\n  emit \\\n    event_type=atm_status \\\n    atm_id=\"$aid\" \\\n    region=\"$region\" \\\n    status=\"$status\"\n  i=$((i + 1))\ndone\n\n# ----- 3. Open Banking TPP requests -----\n# 1-5 PSD2 TPP requests per run. Names pulled from\n# TPP_NAMES (comma-separated). 95% success, 4%\n# rejected for consent, 1% throttled.\nIFS=,; set -- $TPP_NAMES; tpp_count=$#; unset IFS\ncount=$(( $(rand_int 5) + 1 ))\nj=0\nwhile [ \"$j\" -lt \"$count\" ]; do\n  tpp_idx=$(rand_int \"$tpp_count\")\n  n=0\n  for tpp in $(echo \"$TPP_NAMES\" | tr ',' ' '); do\n    if [ \"$n\" -eq \"$tpp_idx\" ]; then\n      tpp_name=\"$tpp\"\n      break\n    fi\n    n=$((n + 1))\n  done\n  flow_idx=$(rand_int 2)\n  if [ \"$flow_idx\" -eq 0 ]; then\n    flow=AISP\n  else\n    flow=PISP\n  fi\n  o=$(rand_int 100)\n  if [ \"$o\" -lt 95 ]; then\n    tpp_outcome=success\n  elif [ \"$o\" -lt 99 ]; then\n    tpp_outcome=consent_rejected\n  else\n    tpp_outcome=throttled\n  fi\n  amt=$(( $(rand_int 49500) + 500 ))\n  emit \\\n    event_type=tpp_request \\\n    tpp_name=\"$tpp_name\" \\\n    flow=\"$flow\" \\\n    outcome=\"$tpp_outcome\" \\\n    amount_minor_units=\"$amt\" \\\n    currency=\"GBP\"\n  j=$((j + 1))\ndone\n\n# ----- 3b. Real TPP payment fan-out into api-gateway -----\n# 1-2 of the simulated TPP requests above are actually\n# POSTed to the api-gateway so they show up in APM\n# traces with channel=tpp and tpp.name=\u003cpartner\u003e. This\n# gives the demo a real \"Open Banking partner X just\n# initiated a payment\" trail in Splunk Observability,\n# not just a synthetic counter.\nif command -v wget \u003e/dev/null 2\u003e\u00261; then\n  real_count=$(( $(rand_int 2) + 1 ))\n  k=0\n  while [ \"$k\" -lt \"$real_count\" ]; do\n    tpp_idx=$(rand_int \"$tpp_count\")\n    n=0\n    for tpp in $(echo \"$TPP_NAMES\" | tr ',' ' '); do\n      if [ \"$n\" -eq \"$tpp_idx\" ]; then\n        tpp_name=\"$tpp\"\n        break\n      fi\n      n=$((n + 1))\n    done\n    pid=\"pay-tpp-$(rand_hex 6)\"\n    amt=$(( $(rand_int 49500) + 500 ))\n    body='{\"payment_id\":\"'\"$pid\"'\",\"scheme\":\"FPS\",\"amount_minor_units\":'\"$amt\"',\"currency\":\"GBP\",\"debtor_country\":\"GB\",\"creditor_country\":\"GB\",\"channel\":\"tpp\",\"tpp_name\":\"'\"$tpp_name\"'\",\"customer_id\":\"cust-tpp-001\",\"customer_tier\":\"silver\"}'\n    # busybox wget supports --post-data + --header.\n    # Quiet+timeout so a backend hiccup never breaks\n    # the cron job.\n    wget -q -T 5 -O- \\\n      --header=\"Content-Type: application/json\" \\\n      --header=\"X-TPP-Name: $tpp_name\" \\\n      --post-data=\"$body\" \\\n      \"http://api-gateway.natwest.svc.cluster.local:8080/process\" \\\n      \u003e/dev/null 2\u003e\u00261 || true\n    k=$((k + 1))\n  done\nfi\n\n# ----- 4. FinOps cost record -----\n# Synthetic Splunk-spend-per-million-payments. This\n# only ever needs to be a stable number for the\n# demo (banks expect a real bill, not real-time\n# billing on a dashboard). We jitter ~ +/- 5% so\n# the panel doesn't look static.\nbase=185\njitter=$(( $(rand_int 21) - 10 ))\nspend=$(( base + jitter ))\npayments_estimate=$(( 950000 + $(rand_int 100000) ))\nemit \\\n  event_type=finops \\\n  spend_gbp_per_million_payments=\"$spend\" \\\n  payments_last_24h=\"$payments_estimate\" \\\n  splunk_ingest_gb_last_24h=\"$(( 28 + $(rand_int 8) ))\"\n"],"command":["/bin/sh","-c"],"env":[{"name":"DEMO_ENV","value":"demo"},{"name":"K8S_CLUSTER","value":"natwest-payments-demo"},{"name":"ATM_COUNT","value":"240"},{"name":"ATM_OUTAGE_PERMILLE","value":"8"},{"name":"TPP_NAMES","value":"TrueLayer,Plaid,Yapily,Tink,Token"},{"name":"DEPLOY_ROLLBACK_PERMILLE","value":"80"},{"name":"DEPLOY_FAIL_PERMILLE","value":"30"}],"image":"alpine:3.19","imagePullPolicy":"IfNotPresent","name":"emitter","resources":{"limits":{"cpu":"100m","memory":"64Mi"},"requests":{"cpu":"10m","memory":"16Mi"}},"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"readOnlyRootFilesystem":true},"terminationMessagePath":"/dev/termination-log","terminationMessagePolicy":"File"}],"dnsPolicy":"ClusterFirst","restartPolicy":"Never","schedulerName":"default-scheduler","securityContext":{"fsGroup":65534,"runAsGroup":65534,"runAsNonRoot":true,"runAsUser":65534,"seccompProfile":{"type":"RuntimeDefault"}},"serviceAccount":"natwest-payments","serviceAccountName":"natwest-payments","terminationGracePeriodSeconds":30}},"ttlSecondsAfterFinished":300}},"schedule":"*/2 * * * *","startingDeadlineSeconds":60,"successfulJobsHistoryLimit":1,"suspend":false}}
