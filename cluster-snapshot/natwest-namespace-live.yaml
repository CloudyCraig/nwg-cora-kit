- apiVersion: v1
  data:
    server.py: |
      """SOAR auto-remediation simulator for the NatWest payments demo.

      POST /webhook         - kick off a playbook run; returns the run record
      GET  /api/runs        - JSON list of recent runs
      GET  /                - HTML dashboard
      GET  /healthz         - readiness probe

      Each run prints a sequence of structured JSON lines to stdout:
        {"event_type":"soar_playbook","phase":"started",   ...}
        {"event_type":"soar_playbook","phase":"step",      ...} (per step)
        {"event_type":"soar_playbook","phase":"completed", ...}

      Steps are deterministic per scenario so the demo always plays the
      same story. Runtime is faked with sleeps; the simulator returns
      the "started" record immediately and finishes the playbook in a
      background thread so callers don't time out.

      Security (codeguard-0-api-web-services + codeguard-0-input-
      validation-injection): caps payload at 32 KiB, requires JSON
      Content-Type, validates scenario against a closed allow-list
      (unknown scenarios fall back to a "generic" runbook).
      """
      from __future__ import annotations

      import json
      import os
      import sys
      import threading
      import time
      import uuid
      from collections import deque
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from typing import Any, Deque
      from urllib.parse import urlparse

      PORT = int(os.environ.get("SOAR_PORT", "8080"))
      MAX_BODY = 32 * 1024
      MAX_RUNS = 50

      ENVIRONMENT = os.environ.get("DEMO_ENVIRONMENT", "demo")
      CLUSTER = os.environ.get("DEMO_CLUSTER", "natwest-payments-demo")

      # Closed allow-list of playbooks. Maps scenario -> ordered list of
      # (step name, simulated wall time in seconds, narrative description).
      PLAYBOOKS: dict[str, list[tuple[str, float, str]]] = {
          "swift-counterparty-flap": [
              ("classify",        0.5,  "Splunk SOAR matched detector tag swift-counterparty-flap"),
              ("isolate",         1.0,  "Disabled flapping SWIFT counterparty BIC=NWBKGB22 in routing-config map"),
              ("failover",        1.5,  "Re-routed FPS-eligible payments to CHAPS scheme as fallback"),
              ("notify",          0.5,  "Posted #payments-incidents Slack message"),
              ("verify",          1.5,  "Polled api-gateway /healthz and confirmed error rate < 0.5% for 60s"),
          ],
          "cache-cold": [
              ("classify",        0.5,  "Detected cold-cache p99 spike on read-api-service"),
              ("warm-cache",      2.0,  "Replayed last 10 minutes of audit log into Redis warm-up keyspace"),
              ("scale-out",       1.0,  "Bumped read-api-service replicas 1 -> 3"),
              ("verify",          1.0,  "Confirmed cache hit ratio > 90% for 60s"),
          ],
          "db-slow": [
              ("classify",        0.5,  "Detected p99 latency >1500ms on ledger-service Postgres"),
              ("kill-runaway",    1.0,  "Cancelled top 5 long-running queries via pg_cancel_backend"),
              ("page-dba",        0.5,  "Opened PagerDuty incident for DBA on-call (P2)"),
              ("verify",          1.5,  "Confirmed p99 latency back under 500ms threshold"),
          ],
          "payment-validation-error-spike": [
              ("classify",        0.5,  "Detected error rate spike on payment-validation-service"),
              ("rollback",        1.5,  "Rolled back deploy via helm rollback natwest-payments"),
              ("verify",          1.5,  "Confirmed error rate back under 1% for 60s"),
              ("notify",          0.5,  "Posted #payments-incidents Slack incident close message"),
          ],
      }
      GENERIC_PLAYBOOK = [
          ("classify",  0.5,  "No specific playbook matched; running generic triage"),
          ("collect",   1.0,  "Captured 5-minute APM service-map snapshot + last-100 traces"),
          ("notify",    0.5,  "Paged on-call SRE with collected diagnostics"),
      ]

      RUNS: Deque[dict[str, Any]] = deque(maxlen=MAX_RUNS)
      RUN_LOCK = threading.Lock()


      def _sanitise(value: str) -> str:
          return value.replace("\r", " ").replace("\n", " ")[:512]


      def _emit(record: dict[str, Any]) -> None:
          sys.stdout.write(json.dumps(record, separators=(",", ":")) + "\n")
          sys.stdout.flush()


      def _execute(run: dict[str, Any]) -> None:
          playbook = PLAYBOOKS.get(run["scenario"], GENERIC_PLAYBOOK)
          run["total_steps"] = len(playbook)
          for idx, (name, wait_s, narrative) in enumerate(playbook, 1):
              time.sleep(wait_s)
              _emit({
                  "event_type": "soar_playbook",
                  "phase":      "step",
                  "run_id":     run["run_id"],
                  "scenario":   run["scenario"],
                  "step":       name,
                  "step_index": idx,
                  "total_steps": len(playbook),
                  "narrative":  narrative,
                  "environment": ENVIRONMENT,
                  "cluster":    CLUSTER,
                  "@timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              })
          run["completed_at"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          run["status"] = "completed"
          run["duration_s"] = round(sum(s[1] for s in playbook), 1)
          _emit({
              "event_type": "soar_playbook",
              "phase":      "completed",
              "run_id":     run["run_id"],
              "scenario":   run["scenario"],
              "status":     "completed",
              "duration_s": run["duration_s"],
              "environment": ENVIRONMENT,
              "cluster":    CLUSTER,
              "@timestamp": run["completed_at"],
          })


      def _start_run(payload: dict[str, Any]) -> dict[str, Any]:
          if isinstance(payload.get("result"), dict):
              payload = {**payload, **payload["result"]}
          # Try to map an o11y detector / ITSI title to a known scenario.
          title = _sanitise(str(payload.get("title") or payload.get("detector") or ""))
          scenario = _sanitise(str(payload.get("scenario") or "")).lower()
          if not scenario:
              t = title.lower()
              for known in PLAYBOOKS:
                  # Translate dash to space for fuzzy matching against
                  # the human-friendly title.
                  if known.replace("-", " ") in t or known in t:
                      scenario = known
                      break
          if not scenario:
              scenario = "generic"
          run = {
              "run_id":      "SOAR-" + uuid.uuid4().hex[:10].upper(),
              "scenario":    scenario,
              "trigger":     _sanitise(str(payload.get("source") or "ITSI")),
              "title":       title or "untitled",
              "status":      "running",
              "started_at":  time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "environment": ENVIRONMENT,
              "cluster":     CLUSTER,
          }
          with RUN_LOCK:
              RUNS.appendleft(run)
          _emit({
              "event_type": "soar_playbook",
              "phase":      "started",
              "run_id":     run["run_id"],
              "scenario":   scenario,
              "trigger":    run["trigger"],
              "title":      run["title"],
              "environment": ENVIRONMENT,
              "cluster":    CLUSTER,
              "@timestamp": run["started_at"],
          })
          # Background-execute so HTTP returns immediately.
          threading.Thread(target=_execute, args=(run,), daemon=True).start()
          return run


      class Handler(BaseHTTPRequestHandler):
          def log_message(self, fmt: str, *args: Any) -> None:
              return

          def _send_json(self, code: int, body: dict[str, Any] | list[Any]) -> None:
              data = json.dumps(body).encode("utf-8")
              self.send_response(code)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(data)))
              self.send_header("Cache-Control", "no-store")
              self.end_headers()
              self.wfile.write(data)

          def _read_body(self) -> dict[str, Any]:
              length = int(self.headers.get("Content-Length", "0") or "0")
              if length <= 0 or length > MAX_BODY:
                  return {}
              raw = self.rfile.read(length)
              try:
                  obj = json.loads(raw.decode("utf-8"))
              except json.JSONDecodeError:
                  return {}
              return obj if isinstance(obj, dict) else {"_raw": str(obj)[:500]}

          def do_GET(self) -> None:
              path = urlparse(self.path).path
              if path == "/healthz":
                  self._send_json(200, {"status": "ok", "runs": len(RUNS)})
                  return
              if path == "/api/runs":
                  with RUN_LOCK:
                      self._send_json(200, {"count": len(RUNS), "result": list(RUNS)})
                  return
              if path in {"/", "/index.html"}:
                  self._send_html()
                  return
              self._send_json(404, {"error": "not found"})

          def do_POST(self) -> None:
              path = urlparse(self.path).path
              if path != "/webhook":
                  self._send_json(404, {"error": "not found"})
                  return
              ctype = (self.headers.get("Content-Type") or "").lower()
              if "application/json" not in ctype:
                  self._send_json(415, {"error": "Content-Type must be application/json"})
                  return
              payload = self._read_body()
              run = _start_run(payload)
              self._send_json(202, {"result": run})

          def _send_html(self) -> None:
              with RUN_LOCK:
                  runs = list(RUNS)
              status_color = {
                  "running":   "#1E93C6",
                  "completed": "#99D18B",
                  "failed":    "#B50101",
              }
              rows = []
              for r in runs:
                  col = status_color.get(r.get("status", "running"), "#94a3b8")
                  rows.append(
                      "<tr>"
                      "<td>" + r.get("run_id", "") + "</td>"
                      "<td><span class=\"chip\" style=\"background:" + col + "\">"
                      + r.get("status", "?").upper() + "</span></td>"
                      "<td>" + r.get("scenario", "") + "</td>"
                      "<td>" + r.get("title", "") + "</td>"
                      "<td>" + r.get("started_at", "") + "</td>"
                      "<td>" + str(r.get("duration_s", "&mdash;")) + "</td>"
                      "</tr>"
                  )
              html = (
                  "<!doctype html><html><head><meta charset=\"utf-8\">"
                  "<title>NatWest demo - Splunk SOAR simulator</title>"
                  "<style>"
                  "body{font-family:-apple-system,Segoe UI,sans-serif;margin:0;background:#0b1220;color:#f3f4f6;}"
                  "header{background:linear-gradient(90deg,#5A287D,#3B1A52);padding:18px 28px;}"
                  "header h1{margin:0;font-size:22px;}"
                  "header p{margin:4px 0 0;color:#dcd0e8;font-size:13px;}"
                  "main{padding:24px 28px;}"
                  ".count{background:#172033;border-radius:8px;padding:16px 20px;display:inline-block;margin-bottom:18px;font-size:18px;}"
                  "table{width:100%;border-collapse:collapse;background:#111827;border-radius:8px;overflow:hidden;}"
                  "th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #1f2937;font-size:13px;}"
                  "th{background:#1f2937;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.4px;font-size:11px;}"
                  ".chip{display:inline-block;padding:2px 10px;border-radius:12px;color:#fff;font-size:11px;font-weight:600;}"
                  ".empty{padding:24px;text-align:center;color:#94a3b8;}"
                  "</style></head><body>"
                  "<header><h1>Splunk SOAR (simulated) &mdash; auto-remediation runs</h1>"
                  "<p>Playbooks triggered by ITSI Episodes / Splunk Observability detectors. "
                  "Stateful per pod (in-memory, capped at " + str(MAX_RUNS) + ").</p></header>"
                  "<main><div class=\"count\">Runs in last hour: <strong>" + str(len(runs)) + "</strong></div>"
                  "<table><thead><tr><th>Run</th><th>Status</th><th>Scenario</th>"
                  "<th>Triggered by</th><th>Started</th><th>Duration (s)</th></tr></thead>"
                  "<tbody>" + ("".join(rows) if rows else "<tr><td colspan=\"6\" class=\"empty\">No playbook runs yet. Trigger one with: scripts/incident.sh swift-counterparty-flap.</td></tr>") + "</tbody></table>"
                  "</main></body></html>"
              )
              data = html.encode("utf-8")
              self.send_response(200)
              self.send_header("Content-Type", "text/html; charset=utf-8")
              self.send_header("Content-Length", str(len(data)))
              self.send_header("Cache-Control", "no-store")
              self.send_header("X-Content-Type-Options", "nosniff")
              self.send_header("X-Frame-Options", "SAMEORIGIN")
              self.send_header("Referrer-Policy", "no-referrer")
              self.end_headers()
              self.wfile.write(data)


      def main() -> None:
          server = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)
          sys.stdout.write(json.dumps({
              "event_type": "soar_simulator_start",
              "port": PORT,
              "scenarios": list(PLAYBOOKS),
              "environment": ENVIRONMENT,
              "cluster": CLUSTER,
          }) + "\n")
          sys.stdout.flush()
          try:
              server.serve_forever()
          finally:
              server.server_close()


      if __name__ == "__main__":
          main()
