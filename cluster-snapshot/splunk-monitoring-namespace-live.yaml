- apiVersion: v1
  data:
    relay: |
      exporters:
        otlp_http:
          auth:
            authenticator: headers_setter
          metrics_endpoint: https://ingest.eu2.observability.splunkcloud.com/v2/datapoint/otlp
          traces_endpoint: https://ingest.eu2.observability.splunkcloud.com/v2/trace/otlp
        otlp_http/entities:
          auth:
            authenticator: headers_setter
          logs_endpoint: https://ingest.eu2.observability.splunkcloud.com/v3/event
        signalfx:
          access_token: ${SPLUNK_OBSERVABILITY_ACCESS_TOKEN}
          api_url: https://api.eu2.observability.splunkcloud.com
          correlation: null
          ingest_url: https://ingest.eu2.observability.splunkcloud.com
          root_path: /hostfs
          sync_host_metadata: true
        signalfx/histograms:
          access_token: ${SPLUNK_OBSERVABILITY_ACCESS_TOKEN}
          api_url: https://api.eu2.observability.splunkcloud.com
          ingest_url: https://ingest.eu2.observability.splunkcloud.com
          send_otlp_histograms: true
        splunk_hec/o11y:
          disable_compression: true
          endpoint: https://ingest.eu2.observability.splunkcloud.com/v1/log
          log_data_enabled: false
          profiling_data_enabled: true
          token: ${SPLUNK_OBSERVABILITY_ACCESS_TOKEN}
        splunk_hec/platform_logs:
          disable_compression: false
          endpoint: https://172.31.140.81:8088/services/collector
          idle_conn_timeout: 10s
          index: main
          max_idle_conns: 200
          max_idle_conns_per_host: 200
          profiling_data_enabled: false
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 300s
            max_interval: 30s
          sending_queue:
            enabled: true
            num_consumers: 10
            queue_size: 1000
          source: kubernetes
          sourcetype: kube:container:natwest
          splunk_app_name: splunk-otel-collector-chart
          splunk_app_version: 0.156.0
          timeout: 10s
          tls:
            insecure_skip_verify: true
          token: ${SPLUNK_PLATFORM_HEC_TOKEN}
        splunk_hec/platform_metrics:
          disable_compression: false
          endpoint: https://172.31.140.81:8088/services/collector
          idle_conn_timeout: 10s
          index: itsi_im_metrics
          max_idle_conns: 200
          max_idle_conns_per_host: 200
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 300s
            max_interval: 30s
          sending_queue:
            enabled: true
            num_consumers: 10
            queue_size: 1000
          source: kubernetes
          sourcetype: otel:metrics
          splunk_app_name: splunk-otel-collector-chart
          splunk_app_version: 0.156.0
          timeout: 10s
          tls:
            insecure_skip_verify: true
          token: ${SPLUNK_PLATFORM_HEC_TOKEN}
        splunk_hec/platform_traces:
          disable_compression: false
          endpoint: https://172.31.140.81:8088/services/collector
          idle_conn_timeout: 10s
          index: otel_traces
          max_idle_conns: 200
          max_idle_conns_per_host: 200
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 300s
            max_interval: 30s
          sending_queue:
            enabled: true
            num_consumers: 10
            queue_size: 1000
          source: kubernetes
          sourcetype: otel:traces
          splunk_app_name: splunk-otel-collector-chart
          splunk_app_version: 0.156.0
          timeout: 10s
          tls:
            insecure_skip_verify: true
          token: ${SPLUNK_PLATFORM_HEC_TOKEN}
      extensions:
        file_storage:
          directory: /var/addon/splunk/otel_pos
        headers_setter:
          headers:
          - action: upsert
            default_value: ${SPLUNK_OBSERVABILITY_ACCESS_TOKEN}
            from_context: X-SF-TOKEN
            key: X-SF-TOKEN
        health_check:
          endpoint: 0.0.0.0:13133
        http_forwarder/opamp_splunk_o11y:
          egress:
            endpoint: https://ingest.eu2.observability.splunkcloud.com
          ingress:
            endpoint: 0.0.0.0:4320
        k8s_observer:
          auth_type: serviceAccount
          node: ${K8S_NODE_NAME}
        opamp/splunk_o11y:
          agent_description:
            include_resource_attributes: true
          server:
            http:
              endpoint: https://ingest.eu2.observability.splunkcloud.com/v1/opamp
              headers:
                X-SF-Token: ${SPLUNK_OBSERVABILITY_ACCESS_TOKEN}
              polling_interval: 30s
        zpages: null
      processors:
        batch:
          metadata_keys:
          - X-SF-Token
        filter/logs:
          logs:
            exclude:
              match_type: strict
              resource_attributes:
              - key: splunk.com/exclude
                value: "true"
        k8s_attributes:
          extract:
            annotations:
            - from: pod
              key: splunk.com/sourcetype
            - from: namespace
              key: splunk.com/exclude
              tag_name: splunk.com/exclude
            - from: pod
              key: splunk.com/exclude
              tag_name: splunk.com/exclude
            - from: namespace
              key: splunk.com/index
              tag_name: com.splunk.index
            - from: pod
              key: splunk.com/index
              tag_name: com.splunk.index
            labels:
            - key: app
            metadata:
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - container.id
            - container.image.name
            - container.image.tag
          filter:
            node_from_env_var: K8S_NODE_NAME
          pod_association:
          - sources:
            - from: resource_attribute
              name: k8s.pod.uid
          - sources:
            - from: resource_attribute
              name: k8s.pod.ip
          - sources:
            - from: resource_attribute
              name: ip
          - sources:
            - from: connection
        k8s_attributes/metrics:
          extract:
            annotations:
            - from: namespace
              key: splunk.com/sourcetype
              tag_name: com.splunk.sourcetype
            - from: pod
              key: splunk.com/sourcetype
              tag_name: com.splunk.sourcetype
            - from: namespace
              key: splunk.com/metricsSourcetype
              tag_name: com.splunk.sourcetype
            - from: pod
              key: splunk.com/metricsSourcetype
              tag_name: com.splunk.sourcetype
            - from: namespace
              key: splunk.com/metricsIndex
              tag_name: com.splunk.index
            - from: pod
              key: splunk.com/metricsIndex
              tag_name: com.splunk.index
            metadata: []
          filter:
            node_from_env_var: K8S_NODE_NAME
          pod_association:
          - sources:
            - from: resource_attribute
              name: k8s.pod.uid
          - sources:
            - from: resource_attribute
              name: k8s.namespace.name
            - from: resource_attribute
              name: k8s.pod.name
          - sources:
            - from: resource_attribute
              name: k8s.pod.ip
          - sources:
            - from: connection
        memory_limiter:
          check_interval: 2s
          limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}
        resource:
          attributes:
          - action: insert
            key: k8s.node.name
            value: ${K8S_NODE_NAME}
          - action: upsert
            key: k8s.cluster.name
            value: nwg-demo
        resource/add_agent_k8s:
          attributes:
          - action: insert
            key: k8s.pod.name
            value: ${K8S_POD_NAME}
          - action: insert
            key: k8s.pod.uid
            value: ${K8S_POD_UID}
          - action: insert
            key: k8s.namespace.name
            value: ${K8S_NAMESPACE}
        resource/infra:
          attributes:
          - action: upsert
            key: service.namespace
            value: natwest-payments
          - action: upsert
            key: deployment.environment
            value: demo
          - action: upsert
            key: k8s.cluster.name
            value: natwest-payments-demo
        resource/logs:
          attributes:
          - action: upsert
            from_attribute: k8s.pod.annotations.splunk.com/sourcetype
            key: com.splunk.sourcetype
          - action: delete
            key: k8s.pod.annotations.splunk.com/sourcetype
          - action: delete
            key: splunk.com/exclude
        resourcedetection:
          detectors:
          - env
          - system
          override: true
          timeout: 15s
        transform/audit_routing:
          log_statements:
          - conditions:
            - resource.attributes["k8s.container.name"] == "audit-tail"
            context: log
            statements:
            - set(resource.attributes["com.splunk.index"], "nwpay_audit")
            - set(resource.attributes["com.splunk.sourcetype"], "nwpay:payment_audit")
            - set(resource.attributes["com.splunk.sourcetype"], "nwpay:auth") where IsString(body)
              and IsMatch(body, "\"event_type\":\"auth\"")
        transform/dbm_routing:
          log_statements:
          - context: log
            statements:
            - set(resource.attributes["com.splunk.index"], "nwpay_infra")
            - set(resource.attributes["com.splunk.sourcetype"], "postgres:dbm")
            - set(resource.attributes["service.name"], "postgres")
        transform/infra_routing:
          log_statements:
          - conditions:
            - resource.attributes["k8s.container.name"] == "postgres"
            context: log
            statements:
            - set(resource.attributes["com.splunk.index"], "nwpay_infra")
            - set(resource.attributes["com.splunk.sourcetype"], "postgresql")
            - set(resource.attributes["service.name"], "postgres")
          - conditions:
            - resource.attributes["k8s.container.name"] == "postgres-exporter"
            context: log
            statements:
            - set(resource.attributes["com.splunk.index"], "nwpay_infra")
            - set(resource.attributes["com.splunk.sourcetype"], "prom:exporter")
          - conditions:
            - resource.attributes["k8s.container.name"] == "redis"
            context: log
            statements:
            - set(resource.attributes["com.splunk.index"], "nwpay_infra")
            - set(resource.attributes["com.splunk.sourcetype"], "redis")
            - set(resource.attributes["service.name"], "redis")
          - conditions:
            - resource.attributes["k8s.container.name"] == "redis-exporter"
            context: log
            statements:
            - set(resource.attributes["com.splunk.index"], "nwpay_infra")
            - set(resource.attributes["com.splunk.sourcetype"], "prom:exporter")
          - conditions:
            - resource.attributes["k8s.container.name"] == "kafka"
            context: log
            statements:
            - set(resource.attributes["com.splunk.index"], "nwpay_infra")
            - set(resource.attributes["com.splunk.sourcetype"], "kafka")
            - set(resource.attributes["service.name"], "kafka")
      receivers:
        file_log:
          encoding: utf-8
          exclude:
          - /var/log/pods/splunk-monitoring_splunk-otel-collector*_*/otel-collector/*.log
          fingerprint_size: 1kb
          force_flush_period: "0"
          include:
          - /var/log/pods/*/*/*.log
          include_file_name: false
          include_file_path: true
          max_concurrent_files: 1024
          max_log_size: 1MiB
          operators:
          - add_metadata_from_filepath: true
            id: container-parser
            max_log_size: 1048576
            type: container
          - combine_field: body
            combine_with: ""
            id: docker-recombine
            if: attributes.logtag == nil
            is_last_entry: body endsWith "\n"
            max_log_size: 1048576
            source_identifier: attributes["log.file.path"]
            type: recombine
          - field: body
            id: handle_empty_log
            if: body == nil
            type: add
            value: ""
          - field: resource["com.splunk.sourcetype"]
            type: add
            value: EXPR("kube:container:"+resource["k8s.container.name"])
          - from: attributes["log.file.path"]
            to: resource["com.splunk.source"]
            type: move
          poll_interval: 200ms
          retry_on_failure:
            enabled: true
          start_at: beginning
          storage: file_storage
        host_metrics:
          collection_interval: 30s
          root_path: /hostfs
          scrapers:
            cpu: null
            disk: null
            filesystem:
              include_mount_points:
                match_type: strict
                mount_points:
                - /
            load: null
            memory: null
            network: null
            paging: null
            processes: null
        jaeger:
          protocols:
            grpc:
              endpoint: 0.0.0.0:14250
            thrift_http:
              endpoint: 0.0.0.0:14268
        kafkametrics:
          brokers:
          - kafka.natwest.svc.cluster.local:9092
          collection_interval: 30s
          protocol_version: 2.0.0
          scrapers:
          - brokers
          - topics
          - consumers
        kubeletstats:
          auth_type: serviceAccount
          collection_interval: 10s
          endpoint: ${K8S_NODE_IP}:10250
          extra_metadata_labels:
          - container.id
          metric_groups:
          - container
          - pod
          - node
          metrics:
            k8s.node.cpu.usage:
              enabled: false
            k8s.pod.cpu.usage:
              enabled: false
        nop: null
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        postgresql:
          collection_interval: 30s
          databases:
          - ledger
          endpoint: postgres.natwest.svc.cluster.local:5432
          password: ${env:PG_EXPORTER_PASSWORD}
          tls:
            insecure: true
          username: ${env:PG_EXPORTER_USER}
        prometheus/agent:
          config:
            scrape_configs:
            - job_name: otel-agent
              metric_relabel_configs:
              - action: drop
                regex: promhttp_metric_handler_errors.*
                source_labels:
                - __name__
              - action: drop
                regex: otelcol_processor_batch_.*
                source_labels:
                - __name__
              - action: drop
                regex: .*otelcol\.k8s\.pod\.association
                source_labels:
                - __name__
              scrape_interval: 10s
              static_configs:
              - targets:
                - localhost:8889
        prometheus/infra:
          config:
            scrape_configs:
            - job_name: redis-exporter
              metrics_path: /metrics
              scrape_interval: 30s
              static_configs:
              - labels:
                  infra_component: redis
                  k8s_namespace: natwest
                targets:
                - redis.natwest.svc.cluster.local:9121
            - job_name: postgres-exporter
              metrics_path: /metrics
              scrape_interval: 30s
              static_configs:
              - labels:
                  infra_component: postgres
                  k8s_namespace: natwest
                targets:
                - postgres.natwest.svc.cluster.local:9187
            - job_name: kafka-jmx-exporter
              metrics_path: /metrics
              scrape_interval: 30s
              static_configs:
              - labels:
                  infra_component: kafka
                  k8s_namespace: natwest
                targets:
                - kafka.natwest.svc.cluster.local:5556
        receiver_creator:
          receivers:
            prometheus/coredns:
              config:
                config:
                  scrape_configs:
                  - job_name: coredns
                    metric_relabel_configs:
                    - action: keep
                      regex: (coredns_dns_request_duration_seconds|coredns_cache_misses_total|coredns_cache_hits_total|coredns_cache_entries|coredns_dns_responses_total|coredns_dns_requests_total|rest_client_requests_total|rest_client_request_duration_seconds)(?:_sum|_count|_bucket)?
                      source_labels:
                      - __name__
                    scrape_interval: 10s
                    static_configs:
                    - targets:
                      - '`endpoint`:9153'
              rule: type == "pod" && labels["k8s-app"] == "kube-dns"
            prometheus/kube-controller-manager:
              config:
                config:
                  scrape_configs:
                  - authorization:
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                      type: Bearer
                    job_name: kube-controller-manager
                    metric_relabel_configs:
                    - action: keep
                      regex: (workqueue_longest_running_processor_seconds|workqueue_unfinished_work_seconds|workqueue_depth|workqueue_retries_total|workqueue_queue_duration_seconds)(?:_sum|_count|_bucket)?
                      source_labels:
                      - __name__
                    scheme: https
                    scrape_interval: 10s
                    static_configs:
                    - targets:
                      - '`endpoint`:10257'
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
              rule: type == "pod" && (labels["k8s-app"] == "kube-controller-manager" ||
                labels["component"] == "kube-controller-manager")
            prometheus/kubernetes-apiserver:
              config:
                config:
                  scrape_configs:
                  - authorization:
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                      type: Bearer
                    job_name: kubernetes-apiserver
                    metric_relabel_configs:
                    - action: keep
                      regex: (apiserver_longrunning_requests|apiserver_request_duration_seconds|apiserver_storage_objects|apiserver_response_sizes|apiserver_request_total|kubernetes_build_info|rest_client_requests_total|rest_client_request_duration_seconds|apiserver_storage_size_bytes|apiserver_requested_deprecated_apis)(?:_sum|_count|_bucket)?
                      source_labels:
                      - __name__
                    scheme: https
                    scrape_interval: 10s
                    static_configs:
                    - targets:
                      - '`endpoint`'
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
              rule: type == "port" && port == 443 && (pod.labels["k8s-app"] == "kube-apiserver"
                || pod.labels["component"] == "kube-apiserver")
            prometheus/kubernetes-proxy:
              config:
                config:
                  scrape_configs:
                  - job_name: kubernetes-proxy
                    metric_relabel_configs:
                    - action: keep
                      regex: (kubeproxy_sync_proxy_rules_iptables_restore_failures_total|kubeproxy_sync_proxy_rules_service_changes_total|kubeproxy_sync_proxy_rules_service_changes_pending|kubeproxy_sync_proxy_rules_duration_seconds|kubeproxy_network_programming_duration_seconds)(?:_sum|_count|_bucket)?
                      source_labels:
                      - __name__
                    - action: drop
                      regex: kubeproxy_network_programming_duration_seconds_bucket;([1-3][1-46-9]|[4-9][1-9]|100|110|115|270)\.0
                      source_labels:
                      - __name__
                      - le
                    scrape_interval: 10s
                    static_configs:
                    - targets:
                      - '`endpoint`:10249'
              rule: type == "pod" && labels["k8s-app"] == "kube-proxy"
            prometheus/kubernetes-scheduler:
              config:
                config:
                  scrape_configs:
                  - authorization:
                      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                      type: Bearer
                    job_name: kubernetes-scheduler
                    metric_relabel_configs:
                    - action: keep
                      regex: (rest_client_request_duration_seconds|rest_client_requests_total|scheduler_pending_pods|scheduler_schedule_attempts_total|scheduler_queue_incoming_pods_total|scheduler_preemption_attempts_total|scheduler_scheduling_algorithm_duration_seconds|scheduler_pod_scheduling_sli_duration_seconds)(?:_sum|_count|_bucket)?
                      source_labels:
                      - __name__
                    scheme: https
                    scrape_interval: 10s
                    static_configs:
                    - targets:
                      - '`endpoint`:10259'
                    tls_config:
                      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      insecure_skip_verify: true
              rule: type == "pod" && (labels["k8s-app"] == "kube-scheduler" || labels["component"]
                == "kube-scheduler")
          watch_observers:
          - k8s_observer
        redis:
          collection_interval: 30s
          endpoint: redis.natwest.svc.cluster.local:6379
          timeout: 5s
        sqlquery/postgres:
          collection_interval: 30s
          datasource: host=postgres.natwest.svc.cluster.local port=5432 user=${env:PG_EXPORTER_USER}
            password=${env:PG_EXPORTER_PASSWORD} dbname=ledger sslmode=disable
          driver: postgres
          queries:
          - logs:
            - body_column: query
            sql: |
              SELECT pid,
                     usename,
                     application_name,
                     COALESCE(client_addr::text, 'unix') AS client_addr,
                     COALESCE(state, 'unknown') AS state,
                     COALESCE(wait_event_type, 'none') AS wait_event_type,
                     COALESCE(wait_event, 'none') AS wait_event,
                     COALESCE(EXTRACT(EPOCH FROM (now() - query_start))::int, 0) AS query_age_seconds,
                     COALESCE(EXTRACT(EPOCH FROM (now() - xact_start))::int, 0) AS xact_age_seconds,
                     query
              FROM pg_stat_activity
              WHERE state IS NOT NULL
                AND state <> 'idle'
                AND pid <> pg_backend_pid()
          - logs:
            - body_column: query
            sql: |
              SELECT queryid::text AS queryid,
                     calls,
                     total_exec_time::bigint AS total_exec_ms,
                     mean_exec_time::int AS mean_exec_ms,
                     rows,
                     query
              FROM pg_stat_statements
              ORDER BY total_exec_time DESC
              LIMIT 20
          - logs:
            - body_column: blocked_query
            sql: |
              SELECT bl.pid AS blocked_pid,
                     ka.query AS blocking_query,
                     kl.pid AS blocking_pid,
                     a.query AS blocked_query,
                     COALESCE(a.application_name, 'unknown') AS blocked_app
              FROM pg_locks bl
              JOIN pg_stat_activity a ON a.pid = bl.pid
              JOIN pg_locks kl ON kl.transactionid = bl.transactionid AND kl.pid <> bl.pid
              JOIN pg_stat_activity ka ON ka.pid = kl.pid
              WHERE NOT bl.granted
